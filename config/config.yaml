# Shyvr RLTE Configuration
# Environment-specific settings with production defaults

app:
  name: "shyvr-rlte"
  version: "0.1.0"
  environment: "${ENVIRONMENT:development}"  # development, staging, production
  log_level: "${LOG_LEVEL:INFO}"
  debug: false
  host: "${HOST:0.0.0.0}"
  port: ${PORT:8080}
  
database:
  host: "${DB_HOST}"
  port: ${DB_PORT:5432}
  database: "${DB_NAME:shyvr_rlte}"
  username: "${DB_USER:rlte_user}"
  password: "${DB_PASSWORD}"
  pool_size: ${DB_POOL_SIZE:10}
  max_overflow: ${DB_MAX_OVERFLOW:20}
  echo: false  # Set to true for SQL query logging
  
  
apis:
  helius:
    api_key: "${HELIUS_API_KEY}"
    base_url: "https://api.helius.xyz"
    rate_limit: 100  # requests per minute
    timeout: 30      # seconds
    
  etherscan:
    api_key: "${ETHERSCAN_API_KEY}"
    base_url: "https://api.etherscan.io"
    rate_limit: 5    # requests per second
    timeout: 30
    
  # Base chain uses Etherscan API v2 (same API key as Ethereum)
  basescan:
    api_key: "${ETHERSCAN_API_KEY}"  # Consolidated: Base now uses Etherscan API v2
    base_url: "https://api.basescan.org"
    rate_limit: 5    # requests per second
    timeout: 30
    
  birdeye:
    api_key: "${BIRDEYE_API_KEY}"
    base_url: "https://public-api.birdeye.so"
    rate_limit: 60   # requests per minute
    timeout: 30
    
  x_api:
    bearer_token: "${X_BEARER_TOKEN}"
    api_key: "${X_API_KEY}"
    api_secret: "${X_API_SECRET}"
    base_url: "https://api.x.com"
    rate_limit: 300  # requests per 15 minutes (Basic tier)
    timeout: 30
    
  lunarcrush:
    api_key: "${LUNARCRUSH_API_KEY}"
    base_url: "https://lunarcrush.com/api4"
    rate_limit: 100  # requests per minute (depends on plan)
    timeout: 30

telegram:
  token: "${TELEGRAM_TOKEN}"
  webhook_secret: "${TELEGRAM_WEBHOOK_SECRET}"
  admin_users: []  # List of admin user IDs
  rate_limit: 30  # messages per minute per user
  
agent:
  model_type: "${AGENT_MODEL_TYPE:local}"  # local, openai, xai
  model_name: "${AGENT_MODEL_NAME:gpt-4o-mini}"  # for OpenAI models
  api_key: "${AGENT_API_KEY:}"  # for cloud models
  max_tokens: 1000
  temperature: 0.1
  max_active_rules: 10
  rule_expiry_hours: 24  # Rules expire after 24 hours
  
trading:
  modes:
    analysis: true
    simulation: true
    live: false  # Disabled by default for safety
    
  risk_management:
    max_position_size_pct: 1.0    # 1% of portfolio max
    max_daily_loss_pct: 5.0       # 5% daily loss limit
    max_drawdown_pct: 15.0        # 15% maximum drawdown
    stop_loss_pct: 8.0            # 8% stop loss
    take_profit_pct: 40.0         # 40% take profit
    max_open_positions: 5         # Maximum concurrent positions
    min_trade_amount_usd: 10      # Minimum trade size
    
  simulation:
    initial_balance: 10000        # Starting balance for simulation
    leverage: 1.0                 # No leverage by default
    slippage_pct: 0.1            # 0.1% slippage simulation
    commission_pct: 0.075        # 0.075% commission (typical DEX fee)

dex:
  # Jupiter DEX (Solana) - Primary DEX for Solana trading
  jupiter:
    enabled: true
    chain: "solana"
    api_key: "${JUPITER_API_KEY:}"      # Optional, not required for public endpoints
    base_url: "https://quote-api.jup.ag"
    max_slippage_bps: 50                # 0.5% maximum slippage
    timeout_seconds: 30
    rate_limit_per_second: 10
    enable_price_impact_warnings: true
    max_price_impact_bps: 1000          # 10% maximum price impact
    
  # Hyperliquid DEX - Perpetual futures trading with order book
  hyperliquid:
    enabled: true                       # Now implemented and ready for use
    chain: "hyperliquid"               # Hyperliquid's own L1 blockchain
    api_key: "${HYPERLIQUID_API_KEY:}" # Required for authenticated trading
    wallet_address: "${HYPERLIQUID_WALLET_ADDRESS:}" # Wallet address for trading
    base_url: "https://api.hyperliquid.xyz"
    testnet_url: "https://api.hyperliquid-testnet.xyz"
    max_slippage_bps: 100              # 1.0% maximum slippage (higher for futures)
    timeout_seconds: 30
    rate_limit_per_second: 5           # Conservative rate limit for authenticated API
    enable_price_impact_warnings: true
    max_price_impact_bps: 500          # 5% maximum price impact
    # Perpetual futures specific settings
    max_leverage: 50                   # Maximum leverage allowed
    default_leverage: 1                # Default leverage for new positions
    funding_rate_threshold: 0.01       # Alert if funding rate exceeds 1%
    
  # Uniswap V3 (Ethereum/Base) - Now implemented
  uniswap_v3:
    enabled: true                       # Now implemented and ready for use
    chain: "ethereum"                   # Primary chain, also supports Base
    api_key: "${UNISWAP_API_KEY:}"     # For enhanced APIs if available
    base_url: "https://api.uniswap.org"
    max_slippage_bps: 50               # 0.5% maximum slippage
    timeout_seconds: 30
    rate_limit_per_second: 10
    enable_price_impact_warnings: true
    max_price_impact_bps: 1000         # 10% maximum price impact
    fee_tiers: [500, 3000, 10000]      # 0.05%, 0.3%, 1.0% (most common tiers)
    # Ethereum network configuration
    rpc_url: "${ETH_RPC_URL:https://mainnet.infura.io/v3/YOUR_PROJECT_ID}"
    wallet_address: "${ETH_WALLET_ADDRESS:}"  # Ethereum wallet address for trading
    private_key_env: "${ETH_PRIVATE_KEY:}"   # Private key for transaction signing
    # Contract addresses (Ethereum mainnet)
    factory_address: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
    router_address: "0xE592427A0AEce92De3Edee1F18E0157C05861564"
    quoter_address: "0xb27308f9F90D607463bb33eA1BeBb41C27CE5AB6"
    position_manager_address: "0xC36442b4a4522E871399CD717aBDD847Ab11FE88"
    
  # Global DEX Settings
  global:
    preferred_stablecoin: "USDC"        # Default stablecoin for pricing
    quote_cache_ttl_seconds: 60         # Cache quotes for 60 seconds
    price_cache_ttl_seconds: 300        # Cache prices for 5 minutes
    retry_attempts: 3                   # Retry failed requests 3 times
    retry_delay_seconds: 1              # Wait 1 second between retries
    enable_routing_optimization: true    # Enable best route finding
    max_hops: 3                         # Maximum hops in routing path

wallets:
  # Solana Wallet Configuration
  solana:
    enabled: true
    chain: "solana"
    network: "${SOLANA_NETWORK:devnet}"  # mainnet-beta, devnet, testnet
    rpc_url: "${SOLANA_RPC_URL:https://api.devnet.solana.com}"
    private_key: "${SOLANA_PRIVATE_KEY:}"  # Base58 or hex private key
    wallet_address: "${SOLANA_WALLET_ADDRESS:}"  # For read-only mode
    timeout_seconds: 30
    max_retries: 3
    commitment: "confirmed"  # processed, confirmed, finalized
    
    # Fee and transaction settings
    priority_fee_lamports: 0  # Additional priority fee (0 = no priority fee)
    compute_unit_limit: 300000  # Max compute units per transaction
    compute_unit_price: 0  # Micro-lamports per compute unit (0 = market price)
    
  # Ethereum Wallet Configuration (Future)
  ethereum:
    enabled: false
    chain: "ethereum"
    network: "${ETH_NETWORK:sepolia}"  # mainnet, sepolia, goerli
    rpc_url: "${ETH_RPC_URL:https://sepolia.infura.io/v3/YOUR_PROJECT_ID}"
    private_key: "${ETH_PRIVATE_KEY:}"  # Hex private key
    wallet_address: "${ETH_WALLET_ADDRESS:}"
    timeout_seconds: 30
    max_retries: 3
    
    # Gas settings
    max_gas_price_gwei: 100  # Maximum gas price in Gwei
    gas_limit_multiplier: 1.2  # Safety multiplier for gas limits
    
  # Base Wallet Configuration (Future)
  base:
    enabled: false
    chain: "base"
    network: "${BASE_NETWORK:base-sepolia}"  # base, base-sepolia
    rpc_url: "${BASE_RPC_URL:https://sepolia.base.org}"
    private_key: "${BASE_PRIVATE_KEY:}"
    wallet_address: "${BASE_WALLET_ADDRESS:}"
    timeout_seconds: 30
    max_retries: 3
    
    # Gas settings
    max_gas_price_gwei: 50   # Base typically has lower gas fees
    gas_limit_multiplier: 1.2
    
  # Global Wallet Settings
  global:
    enable_balance_checks: true         # Check balances before transactions
    enable_account_preparation: true    # Auto-create token accounts if needed
    transaction_confirmation_timeout: 60  # Seconds to wait for confirmation
    enable_transaction_simulation: true  # Simulate before sending (if supported)
    max_slippage_protection: true       # Enable additional slippage protection
    retry_failed_transactions: true     # Retry failed transactions
    transaction_retry_delay: 5          # Seconds between transaction retries

# DEX-Wallet Integration Settings
integration:
  # Swap execution configuration
  swap_execution:
    max_retries: 3                     # Max retry attempts for failed swaps
    retry_delay_seconds: 1.0           # Delay between retry attempts
    enable_balance_checks: true        # Pre-swap balance validation
    enable_account_preparation: true   # Auto-prepare token accounts
    confirmation_timeout_seconds: 60   # Wait time for transaction confirmation
    enable_slippage_protection: true   # Additional slippage validation
    
  # Performance and monitoring
  monitoring:
    log_all_swaps: true                # Log all swap attempts and results
    track_execution_time: true         # Monitor swap execution performance
    alert_on_failures: true           # Send alerts for swap failures
    max_execution_time_seconds: 300    # Alert if swap takes longer than 5 minutes
    
  # Chain-specific integration settings
  solana_integration:
    enable_jupiter_integration: true   # Enable Jupiter DEX integration
    auto_wrap_sol: true               # Auto-wrap SOL for token swaps
    create_ata_if_missing: true       # Create associated token accounts
    use_versioned_transactions: true   # Use Solana versioned transactions
    compute_unit_buffer: 20000        # Extra compute units for complex swaps

ml:
  models:
    lstm:
      hidden_size: 64
      num_layers: 2
      dropout: 0.2
      sequence_length: 60
      lookback_hours: 24
      
    transformer:
      d_model: 128
      nhead: 8
      num_layers: 4
      dropout: 0.1
      
    ensemble:
      weights:
        lstm: 0.4
        transformer: 0.3
        xgboost: 0.3
      
  training:
    batch_size: 32
    learning_rate: 0.001
    epochs: 100
    validation_split: 0.2
    early_stopping_patience: 10
    save_best_model: true
    
  features:
    technical_indicators: true
    onchain_metrics: true
    social_sentiment: true
    timeframes: ["5m", "1h", "4h", "1d"]
    lookback_periods: [14, 30, 60]

rl:
  algorithm: "DQN"           # DQN, PPO, A2C
  training_episodes: 10000
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995
  learning_rate: 0.0001
  gamma: 0.99
  batch_size: 64
  memory_size: 50000
  target_update_freq: 1000
  
  reward_function:
    profit_weight: 1.0
    risk_penalty: 0.1
    agent_bonus: 0.05
    transaction_cost: 0.001
    
  training_schedule:
    retrain_frequency_hours: 24
    min_experiences: 1000
    validation_episodes: 100
  
  # RL Experience Storage Configuration
  experience_storage:
    # Core storage settings
    enabled: ${RL_EXPERIENCE_STORAGE_ENABLED:true}
    storage_backend: "${RL_EXPERIENCE_STORAGE_BACKEND:database}"  # database, memory
    max_experiences: ${RL_EXPERIENCE_MAX_EXPERIENCES:50000}
    batch_size: ${RL_EXPERIENCE_BATCH_SIZE:64}
    prioritized_replay: ${RL_EXPERIENCE_PRIORITIZED_REPLAY:true}
    
    # Performance optimization settings
    performance:
      cache_size: ${RL_EXPERIENCE_CACHE_SIZE:1000}
      async_operations: ${RL_EXPERIENCE_ASYNC_OPS:true}
      compression: ${RL_EXPERIENCE_COMPRESSION:false}
      query_timeout_seconds: ${RL_EXPERIENCE_QUERY_TIMEOUT:30}
      batch_commit_size: ${RL_EXPERIENCE_BATCH_COMMIT_SIZE:100}
    
    # Database-specific configuration
    database:
      pool_size: ${RL_EXPERIENCE_DB_POOL_SIZE:5}
      max_overflow: ${RL_EXPERIENCE_DB_MAX_OVERFLOW:10}
      timeout_seconds: ${RL_EXPERIENCE_DB_TIMEOUT:30}
      enable_query_logging: ${RL_EXPERIENCE_DB_QUERY_LOGGING:false}
      connection_retry_attempts: ${RL_EXPERIENCE_DB_RETRY_ATTEMPTS:3}
      # Database connection settings (inherits from main database config if not specified)
      host: "${RL_EXPERIENCE_DB_HOST:${DB_HOST}}"
      port: ${RL_EXPERIENCE_DB_PORT:${DB_PORT}}
      database: "${RL_EXPERIENCE_DB_NAME:${DB_NAME}}"
      username: "${RL_EXPERIENCE_DB_USER:${DB_USER}}"
      password: "${RL_EXPERIENCE_DB_PASSWORD:${DB_PASSWORD}}"
    
    # Lifecycle management settings
    lifecycle:
      cleanup_enabled: ${RL_EXPERIENCE_CLEANUP_ENABLED:true}
      max_age_days: ${RL_EXPERIENCE_MAX_AGE_DAYS:30}
      cleanup_interval_hours: ${RL_EXPERIENCE_CLEANUP_INTERVAL:24}
      archive_old_experiences: ${RL_EXPERIENCE_ARCHIVE_OLD:false}
      min_experiences_to_keep: ${RL_EXPERIENCE_MIN_TO_KEEP:1000}

discovery:
  chains: ["ethereum", "solana", "base"]
  scan_interval_seconds: 60
  max_tokens_per_scan: 100
  
  filters:
    min_liquidity_usd: 10000
    min_holders: 10
    max_dev_wallet_pct: 10.0
    require_verified: false
    blacklisted_names: ["test", "scam", "fake", "pump"]
    
  telegram:
    channels: []  # Add channel IDs to monitor
    keywords: ["launch", "new", "token", "contract"]

evaluation:
  fundamental_metrics:
    - "liquidity_usd"
    - "holder_count"
    - "volume_24h"
    - "market_cap"
    - "price_change_24h"
    - "dev_wallet_pct"
    - "liquidity_locked_pct"
    
  honeypot_checks:
    enabled: true
    apis: ["honeypot.is", "tokensniffer"]
    confidence_threshold: 0.8
    
  social_metrics:
    x_mentions: true
    telegram_members: true
    reddit_posts: false  # Disabled for now
    
cache:
  default_ttl: 300  # 5 minutes
  token_data_ttl: 180  # 3 minutes for token data
  ml_predictions_ttl: 600  # 10 minutes for ML predictions
  user_data_ttl: 3600  # 1 hour for user data

# Analysis Validation Configuration
analysis_validation:
  # Data quality validation settings
  data_quality:
    min_completeness_ratio: 0.8           # Minimum 80% data completeness
    min_temporal_coverage_hours: 24       # Minimum 24 hours of data coverage
    max_missing_data_points: 100          # Maximum allowed missing data points
    consistency_check_enabled: true       # Enable data consistency checks
    outlier_detection_enabled: true       # Enable outlier detection
    outlier_threshold_std: 3.0            # Standard deviations for outlier detection
    
  # Backtest result validation settings
  backtest_validation:
    max_realistic_daily_return: 0.5       # Maximum realistic daily return (50%)
    min_realistic_daily_return: -0.5      # Minimum realistic daily return (-50%)
    max_sharpe_ratio: 10.0                # Maximum realistic Sharpe ratio
    min_trade_count: 1                    # Minimum number of trades required
    max_trade_count: 10000                # Maximum number of trades allowed
    win_rate_bounds: [0.0, 1.0]          # Valid win rate range (0-100%)
    profit_factor_bounds: [0.0, 50.0]    # Valid profit factor range
    
  # Computational resource monitoring
  resource_monitoring:
    max_memory_usage_mb: 1024             # Maximum memory usage in MB
    max_cpu_usage_percent: 80.0           # Maximum CPU usage percentage
    max_execution_time_seconds: 300       # Maximum execution time (5 minutes)
    memory_leak_detection: true           # Enable memory leak detection
    check_interval_seconds: 5             # Resource check interval
    
  # Analysis quality scoring configuration
  quality_scoring:
    # Component weights for overall quality score
    weights:
      data_completeness: 0.3              # Data completeness weight (30%)
      temporal_coverage: 0.2              # Temporal coverage weight (20%)
      result_consistency: 0.25            # Result consistency weight (25%)
      statistical_validity: 0.25          # Statistical validity weight (25%)
    min_acceptable_score: 0.6             # Minimum acceptable quality score (60%)
    
  # Validation behavior settings
  behavior:
    fail_on_validation_error: false       # Continue on validation errors in analysis mode
    log_validation_details: true          # Log detailed validation results
    store_validation_history: true        # Store validation history for analysis
    alert_on_quality_degradation: true    # Alert when quality scores drop

# Backtest Integration Configuration
backtest_integration:
  # Core integration settings
  enabled: false                          # Disabled by default for minimal coupling
  validation_enabled: true                # Enable validation of backtest data
  
  # Quality filters for validation data
  min_backtest_trades: 10                 # Minimum trades required for integration
  max_validation_age_days: 30             # Maximum age of validation data
  validation_sample_ratio: 0.1            # Sample 10% of validation data
  
  # Performance comparison settings
  performance_comparison_window: 100      # Episodes for live vs backtest comparison
  
  # Data management
  store_validation_history: true          # Store validation comparison history
  max_validation_history_size: 1000       # Maximum history entries to keep
  
monitoring:
  # General monitoring settings
  enabled: true
  sentry_dsn: "${SENTRY_DSN:}"
  health_check_interval: 30
  
  # Prometheus metrics collection
  prometheus:
    enabled: true
    metrics_path: "/metrics"
    collection_interval: 30  # seconds
    push_gateway_url: "${PROMETHEUS_PUSH_GATEWAY:}"  # Optional push gateway
    
  # Metrics collection settings
  metrics:
    trading:
      enabled: true
      collect_pnl: true
      collect_volume: true
      collect_success_rate: true
      collect_positions: true
      histogram_buckets: [10, 50, 100, 500, 1000, 5000, 10000, 50000, 100000]
      
    safety:
      enabled: true
      collect_risk_level: true
      collect_emergency_stops: true
      collect_liquidations: true
      collect_drawdown: true
      collect_violations: true
      risk_level_thresholds: [0.5, 0.7, 0.8, 0.9, 0.95]
      
    system:
      enabled: true
      collect_response_times: true
      collect_error_rates: true
      collect_memory_usage: true
      collect_database_performance: true
      response_time_buckets: [0.1, 0.5, 1.0, 2.5, 5.0, 10.0]
      
    agent:
      enabled: true
      collect_model_performance: true
      collect_decision_accuracy: true
      collect_learning_progress: true
      
  # Alerting configuration
  alerting:
    enabled: true
    
    # Telegram bot alerting
    telegram:
      enabled: true
      bot_token: "${TELEGRAM_MONITORING_BOT_TOKEN:}"
      chat_id: "${TELEGRAM_MONITORING_CHAT_ID:}"
      alert_levels: ["warning", "error", "critical"]
      format_html: true
      
    # Email alerting (optional)
    email:
      enabled: false
      smtp_host: "${ALERT_SMTP_HOST:}"
      smtp_port: ${ALERT_SMTP_PORT:587}
      smtp_user: "${ALERT_SMTP_USER:}"
      smtp_password: "${ALERT_SMTP_PASSWORD:}"
      from_address: "${ALERT_FROM_EMAIL:}"
      to_addresses: []  # List of email addresses
      
    # Webhook alerting (optional)
    webhook:
      enabled: false
      url: "${ALERT_WEBHOOK_URL:}"
      headers: {}
      
  # Alert thresholds
  thresholds:
    # Trading performance
    trading:
      max_daily_loss_pct: 20.0        # Alert if daily loss exceeds 20%
      min_success_rate: 0.3           # Alert if success rate below 30%
      max_drawdown_pct: 25.0          # Alert if drawdown exceeds 25%
      no_trading_minutes: 30          # Alert if no trades for 30 minutes
      
    # Risk management
    safety:
      critical_risk_level: 0.9        # Critical alert at 90% risk
      high_risk_level: 0.8            # Warning alert at 80% risk
      max_open_positions: 10          # Alert if too many positions
      low_margin_ratio: 1.2           # Alert if margin ratio below 1.2
      
    # System health
    system:
      max_response_time: 5.0          # Alert if response time > 5s
      max_error_rate: 0.05            # Alert if error rate > 5%
      max_memory_usage: 0.85          # Alert if memory usage > 85%
      max_db_connection_time: 2.0     # Alert if DB connection > 2s
      
    # Application health
    application:
      max_startup_time: 60            # Alert if startup takes > 60s
      min_uptime_hours: 0.5           # Alert if uptime < 30 minutes
      max_restart_count: 3            # Alert if > 3 restarts per hour
      
  # Grafana dashboard settings
  grafana:
    enabled: true
    dashboard_url: "${GRAFANA_DASHBOARD_URL}"
    api_key: "${GRAFANA_API_KEY:}"
    organization: "${GRAFANA_ORG:Main Org.}"
    
  # Data retention
  retention:
    metrics_days: 30                  # Keep metrics for 30 days
    alerts_days: 90                   # Keep alert history for 90 days
    logs_days: 7                      # Keep detailed logs for 7 days
    
  # Performance monitoring
  performance:
    enable_profiling: false           # CPU/memory profiling
    profile_sample_rate: 0.1          # 10% sampling rate
    slow_query_threshold: 1.0         # Log queries slower than 1s
    monitor_memory_leaks: true
    gc_monitoring: true

# Model Preservation Configuration
model_preservation:
  enabled: "${MODEL_PRESERVATION_ENABLED:true}"
  gcs_bucket: "${GCS_MODEL_BUCKET:shyvr-models-prod}"
  backup_interval_hours: ${MODEL_BACKUP_INTERVAL:6}
  max_versions_per_model: ${MODEL_MAX_VERSIONS:10}
  enable_compression: "${MODEL_COMPRESSION_ENABLED:true}"
  mode_isolation: "${MODEL_MODE_ISOLATION:true}"
      
logging:
  level: "${LOG_LEVEL:INFO}"
  format: "json"  # json or text
  file_enabled: true
  file_path: "logs/rlte.log"
  max_file_size_mb: 100
  backup_count: 5
  
security:
  secret_key: "${SECRET_KEY}"
  jwt_algorithm: "HS256"
  jwt_expiry_hours: 24
  api_key_length: 32
  rate_limit_storage: "memory"  # memory storage for rate limiting
# Google Cloud Build Configuration for Shyvr RLTE Trading System
# Comprehensive CI/CD pipeline with multi-stage builds, testing, security scanning, and deployment
# Author: AI-augmented cryptocurrency trading bot pipeline

steps:
# =============================================================================
# PREPARATION STAGE
# =============================================================================
- name: 'gcr.io/cloud-builders/git'
  id: 'setup-git'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    git config --global --add safe.directory /workspace
    echo "Branch: $BRANCH_NAME"
    echo "Commit SHA: $SHORT_SHA"
    echo "Build ID: $BUILD_ID"

# =============================================================================
# DEPENDENCY CACHING & INSTALLATION
# =============================================================================
- name: 'gcr.io/cloud-builders/docker'
  id: 'restore-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    # Create cache directories
    mkdir -p /workspace/.cache/uv
    mkdir -p /workspace/.cache/pip
    mkdir -p /workspace/.cache/docker
    
    # Try to restore uv cache from previous builds
    gsutil -m cp -r gs://$PROJECT_ID-build-cache/uv-cache/* /workspace/.cache/uv/ || echo "No uv cache to restore"
    gsutil -m cp -r gs://$PROJECT_ID-build-cache/pip-cache/* /workspace/.cache/pip/ || echo "No pip cache to restore"
    echo "Cache restoration completed"

- name: 'python:3.12-slim'
  id: 'install-dependencies'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    
    # Install system dependencies for testing and building
    apt-get update && apt-get install -y \
      build-essential \
      curl \
      git \
      pkg-config \
      libpq-dev \
      libssl-dev \
      libta-lib-dev \
      postgresql-client
    
    # Install uv for faster dependency management
    curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.cargo/bin:$PATH"
    
    # Cache environment variables
    export UV_CACHE_DIR=/workspace/.cache/uv
    export PIP_CACHE_DIR=/workspace/.cache/pip
    
    # Install dependencies with uv
    uv sync --frozen --all-extras
    
    echo "Dependencies installed successfully"
  env:
  - 'UV_CACHE_DIR=/workspace/.cache/uv'
  - 'PIP_CACHE_DIR=/workspace/.cache/pip'

# =============================================================================
# CODE QUALITY & SECURITY CHECKS
# =============================================================================
- name: 'python:3.12-slim'
  id: 'code-quality-checks'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    
    # Install uv
    curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.cargo/bin:$PATH"
    
    # Run code quality checks
    echo "🔍 Running code quality checks..."
    
    # Black formatter check
    echo "⚫ Checking code formatting with Black..."
    uv run black --check --diff src/ tests/ || {
      echo "❌ Code formatting issues found. Run 'uv run black src/ tests/' to fix."
      exit 1
    }
    
    # isort import sorting check
    echo "📦 Checking import sorting with isort..."
    uv run isort --check-only --diff src/ tests/ || {
      echo "❌ Import sorting issues found. Run 'uv run isort src/ tests/' to fix."
      exit 1
    }
    
    # Ruff linting
    echo "🔧 Running linting with Ruff..."
    uv run ruff check src/ tests/ || {
      echo "❌ Linting issues found. Fix the issues above."
      exit 1
    }
    
    # MyPy type checking
    echo "🔍 Running type checking with MyPy..."
    uv run mypy src/ || {
      echo "❌ Type checking issues found. Fix the issues above."
      exit 1
    }
    
    echo "✅ All code quality checks passed!"
  env:
  - 'UV_CACHE_DIR=/workspace/.cache/uv'

- name: 'aquasec/trivy:latest'
  id: 'security-scan-code'
  entrypoint: 'trivy'
  args:
  - 'fs'
  - '--security-checks'
  - 'vuln,secret,config'
  - '--severity'
  - 'HIGH,CRITICAL'
  - '--exit-code'
  - '1'
  - '--format'
  - 'sarif'
  - '--output'
  - '/workspace/trivy-code-report.sarif'
  - '/workspace'

# =============================================================================
# AUTOMATED TESTING STAGE
# =============================================================================
- name: 'python:3.12-slim'
  id: 'unit-tests'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    
    # Install system dependencies
    apt-get update && apt-get install -y \
      build-essential \
      curl \
      git \
      pkg-config \
      libpq-dev \
      libssl-dev \
      libta-lib-dev \
      postgresql-client
    
    # Install uv
    curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.cargo/bin:$PATH"
    
    # Set up test environment
    export PYTHONPATH="/workspace/src"
    export ENVIRONMENT="test"
    export LOG_LEVEL="DEBUG"
    
    echo "🧪 Running unit tests..."
    
    # Run unit tests with coverage
    uv run pytest tests/unit/ \
      --cov=src \
      --cov-report=xml:/workspace/coverage.xml \
      --cov-report=html:/workspace/htmlcov \
      --cov-report=term-missing \
      --junit-xml=/workspace/pytest-results.xml \
      --tb=short \
      -v
    
    echo "✅ Unit tests completed successfully!"
  env:
  - 'UV_CACHE_DIR=/workspace/.cache/uv'
  - 'PIP_CACHE_DIR=/workspace/.cache/pip'

- name: 'python:3.12-slim'
  id: 'integration-tests'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    
    # Install system dependencies
    apt-get update && apt-get install -y \
      build-essential \
      curl \
      git \
      pkg-config \
      libpq-dev \
      libssl-dev \
      libta-lib-dev \
      postgresql-client
    
    # Install uv
    curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.cargo/bin:$PATH"
    
    # Set up test environment
    export PYTHONPATH="/workspace/src"
    export ENVIRONMENT="test"
    export LOG_LEVEL="DEBUG"
    
    echo "🔗 Running integration tests..."
    
    # Run integration tests (with timeout for external API calls)
    timeout 600 uv run pytest tests/integration/ \
      --junit-xml=/workspace/integration-results.xml \
      --tb=short \
      -v \
      -x || {
        echo "⚠️ Some integration tests failed or timed out - this may be expected for external API dependencies"
        echo "✅ Integration test stage completed (errors may be acceptable)"
      }
  env:
  - 'UV_CACHE_DIR=/workspace/.cache/uv'
  - 'PIP_CACHE_DIR=/workspace/.cache/pip'

- name: 'python:3.12-slim'
  id: 'performance-tests'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    
    # Install system dependencies
    apt-get update && apt-get install -y \
      build-essential \
      curl \
      git \
      pkg-config \
      libpq-dev \
      libssl-dev \
      libta-lib-dev \
      postgresql-client
    
    # Install uv
    curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.cargo/bin:$PATH"
    
    # Set up test environment
    export PYTHONPATH="/workspace/src"
    export ENVIRONMENT="test"
    export LOG_LEVEL="INFO"
    
    echo "⚡ Running performance tests..."
    
    # Run performance benchmarks
    timeout 300 uv run pytest tests/performance/ \
      --benchmark-only \
      --benchmark-json=/workspace/benchmark-results.json \
      --junit-xml=/workspace/performance-results.xml \
      -v || {
        echo "⚠️ Performance tests completed with warnings"
      }
    
    echo "✅ Performance testing completed!"
  env:
  - 'UV_CACHE_DIR=/workspace/.cache/uv'
  - 'PIP_CACHE_DIR=/workspace/.cache/pip'

# =============================================================================
# DOCKER BUILD STAGE
# =============================================================================
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  args:
  - 'build'
  - '--platform=linux/amd64'
  - '--cache-from'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/shyvr-ai-prod/shyvr-rlte:latest'
  - '-t'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/shyvr-ai-prod/shyvr-rlte:$SHORT_SHA'
  - '-t'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/shyvr-ai-prod/shyvr-rlte:latest'
  - '.'

# Security scan of Docker image
- name: 'aquasec/trivy:latest'
  id: 'security-scan-image'
  entrypoint: 'trivy'
  args:
  - 'image'
  - '--security-checks'
  - 'vuln,config'
  - '--severity'
  - 'HIGH,CRITICAL'
  - '--exit-code'
  - '0'  # Don't fail build on vulnerabilities, just report
  - '--format'
  - 'sarif'
  - '--output'
  - '/workspace/trivy-image-report.sarif'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/shyvr-ai-prod/shyvr-rlte:$SHORT_SHA'

# Push Docker image
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  args:
  - 'push'
  - '--all-tags'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/shyvr-ai-prod/shyvr-rlte'

# =============================================================================
# DEPLOYMENT STAGE (Branch-specific)
# =============================================================================
# Deploy to staging (develop branch)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy-staging'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    if [[ "$BRANCH_NAME" == "develop" ]]; then
      echo "🚀 Deploying to staging environment..."
      
      # Get current revision for rollback capability
      CURRENT_REVISION=$(gcloud run services describe shyvr-rlte-staging --region=us-central1 --format="value(status.latestReadyRevisionName)" 2>/dev/null || echo "")
      
      # Deploy to staging Cloud Run service with transformer-optimized configuration
      gcloud run deploy shyvr-rlte-staging \
        --image=us-central1-docker.pkg.dev/$PROJECT_ID/shyvr-ai-prod/shyvr-rlte:$SHORT_SHA \
        --region=us-central1 \
        --platform=managed \
        --port=8080 \
        --memory=6Gi \
        --cpu=4 \
        --concurrency=20 \
        --timeout=2700 \
        --max-instances=5 \
        --min-instances=0 \
        --allow-unauthenticated \
        --cpu-boost \
        --execution-environment=gen2 \
        --set-env-vars="ENVIRONMENT=staging,LOG_LEVEL=INFO,TRADING_MODE=simulation,BUILD_ID=$BUILD_ID,COMMIT_SHA=$SHORT_SHA,TRANSFORMER_OPTIMIZED=true,TRANSFORMER_BATCH_SIZE=1,TRANSFORMER_MAX_LENGTH=512,TORCH_COMPILE_MODE=reduce-overhead,TRANSFORMERS_CACHE=/app/models/cache,TOKENIZERS_PARALLELISM=false,OMP_NUM_THREADS=4,MKL_NUM_THREADS=4,PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128,TRANSFORMERS_NO_ADVISORY_WARNINGS=1,TORCH_INFERENCE_MODE=1" \
        --add-cloudsql-instances="$PROJECT_ID:us-central1:shyvr-rlte-db" \
        --set-secrets="TELEGRAM_TOKEN=TELEGRAM_TOKEN:latest,WEBHOOK_SECRET=WEBHOOK_SECRET:latest,DB_PASSWORD=DB_PASSWORD:latest,DATABASE_URL=DATABASE_URL:latest,HELIUS_API_KEY=HELIUS_API_KEY:latest,BIRDEYE_API_KEY=BIRDEYE_API_KEY:latest,SECRET_KEY=SECRET_KEY:latest" \
        --no-traffic \
        --tag="staging-$SHORT_SHA" \
        --quiet
      
      # Get new revision
      NEW_REVISION=$(gcloud run services describe shyvr-rlte-staging --region=us-central1 --format="value(status.latestCreatedRevisionName)")
      
      # Gradual traffic migration for staging
      echo "🚦 Starting blue-green deployment to staging..."
      
      if [[ -n "$CURRENT_REVISION" ]]; then
        # Start with 50% traffic to new revision
        gcloud run services update-traffic shyvr-rlte-staging \
          --region=us-central1 \
          --to-revisions="$NEW_REVISION=50,$CURRENT_REVISION=50" \
          --quiet
        
        echo "⏳ Testing new revision with 50% traffic..."
        sleep 60
        
        # Get staging URL and test
        STAGING_URL=$(gcloud run services describe shyvr-rlte-staging --region=us-central1 --format="value(status.url)")
        
        # Comprehensive health checks
        HEALTH_CHECK_PASSED=true
        for i in {1..5}; do
          if ! curl -f -s -m 30 "$STAGING_URL/health" > /dev/null; then
            echo "❌ Health check $i failed"
            HEALTH_CHECK_PASSED=false
            break
          fi
          sleep 10
        done
        
        if [[ "$HEALTH_CHECK_PASSED" == "true" ]]; then
          # Migrate 100% traffic to new revision
          gcloud run services update-traffic shyvr-rlte-staging \
            --region=us-central1 \
            --to-revisions="$NEW_REVISION=100" \
            --quiet
          echo "✅ Staging blue-green deployment successful!"
        else
          # Rollback to previous revision
          echo "🔄 Rolling back staging deployment due to health check failures..."
          gcloud run services update-traffic shyvr-rlte-staging \
            --region=us-central1 \
            --to-revisions="$CURRENT_REVISION=100" \
            --quiet
          exit 1
        fi
      else
        # First deployment - direct 100% traffic
        gcloud run services update-traffic shyvr-rlte-staging \
          --region=us-central1 \
          --to-revisions="$NEW_REVISION=100" \
          --quiet
        
        # Test first deployment
        sleep 30
        STAGING_URL=$(gcloud run services describe shyvr-rlte-staging --region=us-central1 --format="value(status.url)")
        
        if curl -f -s -m 30 "$STAGING_URL/health" > /dev/null; then
          echo "✅ Initial staging deployment successful and healthy!"
        else
          echo "❌ Initial staging deployment health check failed"
          exit 1
        fi
      fi
    else
      echo "Skipping staging deployment - not on develop branch"
    fi

# Deploy to production (main branch)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'deploy-production'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    if [[ "$BRANCH_NAME" == "main" ]]; then
      echo "🚀 Deploying to production environment..."
      
      # Get current production revision for rollback capability
      CURRENT_REVISION=$(gcloud run services describe shyvr-rlte --region=us-central1 --format="value(status.latestReadyRevisionName)" 2>/dev/null || echo "")
      
      # Production deployment with full configuration and blue-green strategy (transformer-optimized)
      gcloud run deploy shyvr-rlte \
        --image=us-central1-docker.pkg.dev/$PROJECT_ID/shyvr-ai-prod/shyvr-rlte:$SHORT_SHA \
        --region=us-central1 \
        --platform=managed \
        --port=8080 \
        --memory=8Gi \
        --cpu=6 \
        --concurrency=15 \
        --timeout=4200 \
        --max-instances=10 \
        --min-instances=1 \
        --allow-unauthenticated \
        --cpu-boost \
        --execution-environment=gen2 \
        --session-affinity \
        --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=INFO,TRADING_MODE=simulation,BUILD_ID=$BUILD_ID,COMMIT_SHA=$SHORT_SHA,ML_OPTIMIZED=true,RL_STORAGE_ENABLED=true,MODEL_PRESERVATION_ENABLED=true,TRANSFORMER_OPTIMIZED=true,TRANSFORMER_BATCH_SIZE=1,TRANSFORMER_MAX_LENGTH=512,TORCH_COMPILE_MODE=reduce-overhead,TRANSFORMERS_CACHE=/app/models/cache,TOKENIZERS_PARALLELISM=false,OMP_NUM_THREADS=6,MKL_NUM_THREADS=6,PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128,TRANSFORMERS_NO_ADVISORY_WARNINGS=1,TORCH_INFERENCE_MODE=1" \
        --add-cloudsql-instances="$PROJECT_ID:us-central1:shyvr-rlte-db" \
        --set-secrets="TELEGRAM_TOKEN=TELEGRAM_TOKEN:latest,WEBHOOK_SECRET=WEBHOOK_SECRET:latest,DB_PASSWORD=DB_PASSWORD:latest,DATABASE_URL=DATABASE_URL:latest,HELIUS_API_KEY=HELIUS_API_KEY:latest,BIRDEYE_API_KEY=BIRDEYE_API_KEY:latest,XAI_API_KEY=XAI_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,COINGECKO_API_KEY=COINGECKO_API_KEY:latest,LUNARCRUSH_API_KEY=LUNARCRUSH_API_KEY:latest,SECRET_KEY=SECRET_KEY:latest" \
        --no-traffic \
        --tag="production-$SHORT_SHA" \
        --quiet
      
      # Get new revision
      NEW_REVISION=$(gcloud run services describe shyvr-rlte --region=us-central1 --format="value(status.latestCreatedRevisionName)")
      
      # Production blue-green deployment with safety checks
      echo "🚦 Starting production blue-green deployment..."
      echo "⚠️  Production deployment requires additional safety measures"
      
      if [[ -n "$CURRENT_REVISION" ]]; then
        # Start with 10% traffic to new revision (more conservative for production)
        gcloud run services update-traffic shyvr-rlte \
          --region=us-central1 \
          --to-revisions="$NEW_REVISION=10,$CURRENT_REVISION=90" \
          --quiet
        
        echo "⏳ Testing new revision with 10% traffic for 2 minutes..."
        sleep 120
        
        # Get production URL and test
        PROD_URL=$(gcloud run services describe shyvr-rlte --region=us-central1 --format="value(status.url)")
        
        # Comprehensive production health checks
        HEALTH_CHECK_PASSED=true
        ERROR_COUNT=0
        
        for i in {1..10}; do
          if ! curl -f -s -m 30 "$PROD_URL/health" > /dev/null; then
            echo "❌ Health check $i failed"
            ERROR_COUNT=$((ERROR_COUNT + 1))
            if [[ $ERROR_COUNT -ge 3 ]]; then
              HEALTH_CHECK_PASSED=false
              break
            fi
          else
            echo "✅ Health check $i passed"
          fi
          sleep 15
        done
        
        if [[ "$HEALTH_CHECK_PASSED" == "true" ]]; then
          # Increase to 50% traffic
          echo "📈 Increasing traffic to 50%..."
          gcloud run services update-traffic shyvr-rlte \
            --region=us-central1 \
            --to-revisions="$NEW_REVISION=50,$CURRENT_REVISION=50" \
            --quiet
          
          sleep 120
          
          # Final health check before full migration
          if curl -f -s -m 30 "$PROD_URL/health" > /dev/null; then
            # Migrate 100% traffic to new revision
            gcloud run services update-traffic shyvr-rlte \
              --region=us-central1 \
              --to-revisions="$NEW_REVISION=100" \
              --quiet
            echo "✅ Production blue-green deployment successful!"
            
            # Update Telegram webhook for production
            if [[ -n "$TELEGRAM_TOKEN" ]]; then
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/setWebhook" \
                -d "url=$PROD_URL/webhook" \
                -d "drop_pending_updates=true"
              echo "📱 Telegram webhook updated to new production deployment"
            fi
          else
            echo "🔄 Final health check failed - rolling back production deployment..."
            gcloud run services update-traffic shyvr-rlte \
              --region=us-central1 \
              --to-revisions="$CURRENT_REVISION=100" \
              --quiet
            exit 1
          fi
        else
          # Rollback to previous revision
          echo "🔄 Rolling back production deployment due to health check failures..."
          gcloud run services update-traffic shyvr-rlte \
            --region=us-central1 \
            --to-revisions="$CURRENT_REVISION=100" \
            --quiet
          exit 1
        fi
      else
        # First production deployment - direct 100% traffic with extensive validation
        echo "🚨 FIRST PRODUCTION DEPLOYMENT - Extra validation required"
        gcloud run services update-traffic shyvr-rlte \
          --region=us-central1 \
          --to-revisions="$NEW_REVISION=100" \
          --quiet
        
        # Extended validation for first deployment
        sleep 60
        PROD_URL=$(gcloud run services describe shyvr-rlte --region=us-central1 --format="value(status.url)")
        
        # Extended health check sequence
        VALIDATION_PASSED=true
        for i in {1..5}; do
          if ! curl -f -s -m 30 "$PROD_URL/health" > /dev/null; then
            echo "❌ Initial production health check $i failed"
            VALIDATION_PASSED=false
          else
            echo "✅ Initial production health check $i passed"
          fi
          sleep 30
        done
        
        if [[ "$VALIDATION_PASSED" == "true" ]]; then
          echo "✅ Initial production deployment successful and validated!"
          
          # Update Telegram webhook for production
          if [[ -n "$TELEGRAM_TOKEN" ]]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/setWebhook" \
              -d "url=$PROD_URL/webhook" \
              -d "drop_pending_updates=true"
            echo "📱 Telegram webhook configured for first production deployment"
          fi
        else
          echo "❌ Initial production deployment validation failed"
          exit 1
        fi
      fi
    else
      echo "Skipping production deployment - not on main branch"
    fi

# =============================================================================
# CACHE PERSISTENCE & CLEANUP
# =============================================================================
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'save-cache'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    # Save build caches for future builds
    echo "💾 Saving build caches..."
    
    # Save uv cache
    if [[ -d "/workspace/.cache/uv" ]]; then
      gsutil -m cp -r /workspace/.cache/uv/* gs://$PROJECT_ID-build-cache/uv-cache/ || echo "Failed to save uv cache"
    fi
    
    # Save pip cache
    if [[ -d "/workspace/.cache/pip" ]]; then
      gsutil -m cp -r /workspace/.cache/pip/* gs://$PROJECT_ID-build-cache/pip-cache/ || echo "Failed to save pip cache"
    fi
    
    echo "✅ Cache persistence completed"

# =============================================================================
# NOTIFICATION & REPORTING
# =============================================================================
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'build-notification'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    echo "📊 Build Summary:"
    echo "===================="
    echo "Project: Shyvr RLTE Trading System"
    echo "Branch: $BRANCH_NAME"
    echo "Commit: $SHORT_SHA"
    echo "Build ID: $BUILD_ID"
    echo "Status: SUCCESS"
    echo "===================="
    
    # Archive test results and reports
    echo "📁 Archiving build artifacts..."
    
    # Upload test results to Cloud Storage
    if [[ -f "/workspace/coverage.xml" ]]; then
      gsutil cp /workspace/coverage.xml gs://$PROJECT_ID-build-artifacts/$BUILD_ID/coverage.xml
    fi
    
    if [[ -f "/workspace/pytest-results.xml" ]]; then
      gsutil cp /workspace/pytest-results.xml gs://$PROJECT_ID-build-artifacts/$BUILD_ID/pytest-results.xml
    fi
    
    if [[ -f "/workspace/benchmark-results.json" ]]; then
      gsutil cp /workspace/benchmark-results.json gs://$PROJECT_ID-build-artifacts/$BUILD_ID/benchmark-results.json
    fi
    
    if [[ -f "/workspace/trivy-code-report.sarif" ]]; then
      gsutil cp /workspace/trivy-code-report.sarif gs://$PROJECT_ID-build-artifacts/$BUILD_ID/trivy-code-report.sarif
    fi
    
    if [[ -f "/workspace/trivy-image-report.sarif" ]]; then
      gsutil cp /workspace/trivy-image-report.sarif gs://$PROJECT_ID-build-artifacts/$BUILD_ID/trivy-image-report.sarif
    fi
    
    echo "✅ Build artifacts archived successfully!"

# =============================================================================
# BUILD CONFIGURATION
# =============================================================================
options:
  # Use high-CPU machine for transformer builds
  machineType: 'E2_HIGHCPU_16'
  diskSizeGb: 150
  
  # Logging configuration
  logging: CLOUD_LOGGING_ONLY
  logStreamingOption: STREAM_ON
  
  # Environment variables
  env:
  - 'PYTHONUNBUFFERED=1'
  - 'PYTHONDONTWRITEBYTECODE=1'
  - 'ENVIRONMENT=ci'

# Build timeout (1 hour for transformer builds)
timeout: '3600s'

# Build triggers for different branches
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/TELEGRAM_TOKEN/versions/latest
    env: 'TELEGRAM_TOKEN'
  - versionName: projects/$PROJECT_ID/secrets/WEBHOOK_SECRET/versions/latest
    env: 'WEBHOOK_SECRET'
  - versionName: projects/$PROJECT_ID/secrets/DB_PASSWORD/versions/latest
    env: 'DB_PASSWORD'
  - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
    env: 'DATABASE_URL'
  - versionName: projects/$PROJECT_ID/secrets/HELIUS_API_KEY/versions/latest
    env: 'HELIUS_API_KEY'

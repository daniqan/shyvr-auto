# ============================================================================
# GCP Secret Manager Configuration Template - Production
# Transformer-Enabled RLTE Trading System  
# ============================================================================
#
# This template provides comprehensive secret management configuration for
# production deployment using Google Cloud Secret Manager with automated
# rotation, access control, and compliance features.
#
# Based on actual implementation requirements from system architecture.
#
# Last Updated: 2025-08-06

# ============================================================================
# SECRET DEFINITIONS
# ============================================================================

# Database Credentials
database_credentials:
  secret_id: "database-credentials"
  description: "Production database connection credentials"
  replication:
    automatic:
      customer_managed_encryption: null
  labels:
    environment: "production"
    component: "database"
    tier: "critical"
  rotation:
    rotation_period: "2592000s"  # 30 days
    next_rotation_time: null
  expiration: null
  ttl: null
  annotations:
    compliance.shyvr.ai/data-classification: "confidential"
    security.shyvr.ai/access-level: "restricted"
  secret_data:
    host: "${DB_HOST}"
    port: "${DB_PORT}"
    database: "${DB_NAME}" 
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    connection_string: "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"

# GCP Service Account Credentials
gcp_credentials:
  secret_id: "gcp-service-account"
  description: "GCP service account key for Cloud Run services"
  replication:
    automatic:
      customer_managed_encryption:
        kms_key_name: "projects/${GCP_PROJECT_ID}/locations/global/keyRings/shyvr-rlte-production/cryptoKeys/secrets-key"
  labels:
    environment: "production"
    component: "gcp"
    tier: "critical"
  rotation:
    rotation_period: "5184000s"  # 60 days
  annotations:
    compliance.shyvr.ai/data-classification: "confidential"
    security.shyvr.ai/access-level: "system"
  secret_data:
    project_id: "${GCP_PROJECT_ID}"
    service_account_key: "${GCP_SERVICE_ACCOUNT_KEY_JSON}"
    model_bucket: "${GCS_BUCKET}"

# External API Keys
api_keys:
  secret_id: "api-keys"
  description: "External API keys for trading system integrations"
  replication:
    user_managed:
      replicas:
      - location: "us-central1"
        customer_managed_encryption:
          kms_key_name: "projects/${GCP_PROJECT_ID}/locations/us-central1/keyRings/shyvr-rlte-production/cryptoKeys/api-keys"
      - location: "us-east1"
        customer_managed_encryption:
          kms_key_name: "projects/${GCP_PROJECT_ID}/locations/us-east1/keyRings/shyvr-rlte-production/cryptoKeys/api-keys"
  labels:
    environment: "production"
    component: "external-apis"
    tier: "high"
  rotation:
    rotation_period: "7776000s"  # 90 days
  annotations:
    compliance.shyvr.ai/data-classification: "sensitive"
  secret_data:
    openai_key: "${OPENAI_API_KEY}"
    helius_key: "${HELIUS_API_KEY}"
    etherscan_key: "${ETHERSCAN_API_KEY}"
    birdeye_key: "${BIRDEYE_API_KEY}"

# Monitoring and Alerting Configuration
monitoring_config:
  secret_id: "monitoring-config"
  description: "Monitoring, alerting, and notification configuration"
  labels:
    environment: "production"
    component: "monitoring"
    tier: "medium"
  rotation:
    rotation_period: "10368000s"  # 120 days
  secret_data:
    webhook_url: "${ALERT_WEBHOOK_URL}"
    grafana_password: "${GRAFANA_ADMIN_PASSWORD}"
    telegram_bot_token: "${TELEGRAM_MONITORING_BOT_TOKEN}"
    telegram_chat_id: "${TELEGRAM_MONITORING_CHAT_ID}"
    smtp_password: "${SMTP_PASSWORD}"

# Trading System Secrets
trading_secrets:
  secret_id: "trading-secrets"
  description: "Trading system authentication and security keys"
  replication:
    automatic:
      customer_managed_encryption:
        kms_key_name: "projects/${GCP_PROJECT_ID}/locations/global/keyRings/shyvr-rlte-production/cryptoKeys/trading-key"
  labels:
    environment: "production"
    component: "trading"
    tier: "critical"
  rotation:
    rotation_period: "1296000s"  # 15 days - more frequent for trading secrets
  annotations:
    compliance.shyvr.ai/data-classification: "restricted"
    security.shyvr.ai/pci-scope: "true"
  secret_data:
    secret_key: "${SECRET_KEY}"
    jwt_secret: "${JWT_SECRET}"
    encryption_key: "${ENCRYPTION_KEY}"
    telegram_webhook_secret: "${TELEGRAM_WEBHOOK_SECRET}"

# Redis Configuration
redis_credentials:
  secret_id: "redis-credentials"
  description: "Redis cache and session store credentials"
  labels:
    environment: "production"
    component: "cache"
    tier: "medium"
  rotation:
    rotation_period: "2592000s"  # 30 days
  secret_data:
    redis_url: "${REDIS_URL}"
    redis_password: "${REDIS_PASSWORD}"

# ============================================================================
# ACCESS CONTROL POLICIES  
# ============================================================================

# Production Service Account Access
production_service_access:
  secret_id: "database-credentials"
  policy:
    bindings:
    - role: "roles/secretmanager.secretAccessor"
      members:
      - "serviceAccount:shyvr-rlte-production@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
      - "serviceAccount:cloud-run-invoker@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
    - role: "roles/secretmanager.viewer" 
      members:
      - "group:production-ops@your-domain.com"
    audit_config:
      audit_log_configs:
      - log_type: "DATA_READ"
        exempted_members: []
      - log_type: "DATA_WRITE"

# API Keys Access Control
api_keys_access:
  secret_id: "api-keys"
  policy:
    bindings:
    - role: "roles/secretmanager.secretAccessor"
      members:
      - "serviceAccount:shyvr-rlte-production@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
    - role: "roles/secretmanager.secretVersionManager"
      members:
      - "group:platform-admins@your-domain.com"
      condition:
        title: "Time-based access"
        description: "Only allow access during business hours"
        expression: 'request.time.getHours() >= 8 && request.time.getHours() < 18'

# Monitoring Configuration Access
monitoring_access:
  secret_id: "monitoring-config"
  policy:
    bindings:
    - role: "roles/secretmanager.secretAccessor"
      members:
      - "serviceAccount:shyvr-rlte-production@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
      - "serviceAccount:monitoring-service@${GCP_PROJECT_ID}.iam.gserviceaccount.com"

# ============================================================================
# AUTOMATED ROTATION CONFIGURATION
# ============================================================================

# Database Credentials Rotation
database_rotation:
  secret_id: "database-credentials"
  rotation_config:
    rotation_function:
      name: "projects/${GCP_PROJECT_ID}/locations/us-central1/functions/rotate-database-credentials"
      source_archive_url: "gs://${GCP_PROJECT_ID}-functions-source/database-rotation.zip"
      entry_point: "rotate_database_credentials"
      runtime: "python39"
      environment_variables:
        CLOUD_SQL_INSTANCE: "${CLOUD_SQL_CONNECTION_NAME}"
        DB_NAME: "${POSTGRES_DB}"
    rotation_period: "2592000s"  # 30 days
    next_rotation_time: null
    notification_config:
      pubsub:
        topic: "projects/${GCP_PROJECT_ID}/topics/secret-rotation-notifications"

# API Keys Rotation
api_keys_rotation:
  secret_id: "api-keys"
  rotation_config:
    rotation_function:
      name: "projects/${GCP_PROJECT_ID}/locations/us-central1/functions/rotate-api-keys"
      source_archive_url: "gs://${GCP_PROJECT_ID}-functions-source/api-rotation.zip"
      entry_point: "rotate_api_keys"
      runtime: "python39"
    rotation_period: "7776000s"  # 90 days
    notification_config:
      pubsub:
        topic: "projects/${GCP_PROJECT_ID}/topics/secret-rotation-notifications"

# ============================================================================
# MONITORING AND ALERTING FOR SECRET MANAGEMENT
# ============================================================================

# Secret Access Monitoring
secret_monitoring:
  metrics:
  - name: "secret_access_count"
    description: "Number of secret access requests"
    type: "COUNTER"
    labels:
    - "secret_id"
    - "requester"
    - "success"
    
  - name: "secret_rotation_status"
    description: "Status of secret rotation operations"
    type: "GAUGE"
    labels:
    - "secret_id"
    - "rotation_type"
    
  - name: "secret_age_days"
    description: "Age of secret versions in days"
    type: "GAUGE"
    labels:
    - "secret_id"
    - "version"

  alert_policies:
  - name: "secret-access-anomaly"
    display_name: "Unusual Secret Access Pattern"
    conditions:
    - display_name: "High secret access rate"
      condition_threshold:
        filter: 'resource.type="secret_manager.secret" AND metric.type="custom.googleapis.com/secret_access_count"'
        comparison: "COMPARISON_GREATER_THAN"
        threshold_value: 100
        duration: "300s"
    notification_channels:
    - "projects/${GCP_PROJECT_ID}/notificationChannels/security-alerts"
    
  - name: "secret-rotation-failure"
    display_name: "Secret Rotation Failed"
    conditions:
    - display_name: "Rotation failure detected"
      condition_threshold:
        filter: 'resource.type="secret_manager.secret" AND metric.type="custom.googleapis.com/secret_rotation_status"'
        comparison: "COMPARISON_EQUAL"
        threshold_value: 0
        duration: "60s"
    severity: "CRITICAL"
    notification_channels:
    - "projects/${GCP_PROJECT_ID}/notificationChannels/critical-alerts"

# ============================================================================
# COMPLIANCE AND AUDIT CONFIGURATION
# ============================================================================

# Audit Logging Configuration  
audit_config:
  service: "secretmanager.googleapis.com"
  audit_log_configs:
  - log_type: "ADMIN_READ"
    exempted_members: []
  - log_type: "DATA_READ"
    exempted_members:
    - "serviceAccount:monitoring-service@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
  - log_type: "DATA_WRITE"
    exempted_members: []

# Data Loss Prevention (DLP) Configuration
dlp_config:
  inspection_template:
    name: "projects/${GCP_PROJECT_ID}/inspectionTemplates/secret-inspection"
    display_name: "Secret Content Inspection"
    description: "DLP inspection template for secret manager content"
    inspect_config:
      info_types:
      - name: "CREDIT_CARD_NUMBER"
      - name: "US_SOCIAL_SECURITY_NUMBER"
      - name: "EMAIL_ADDRESS"
      - name: "PHONE_NUMBER"
      custom_info_types:
      - info_type:
          name: "API_KEY"
        regex:
          pattern: "sk-[a-zA-Z0-9]{48}"
      - info_type:
          name: "DATABASE_PASSWORD"
        regex:
          pattern: "postgres://[^:]+:([^@]+)@"
      min_likelihood: "POSSIBLE"

# Compliance Labels
compliance_labels:
  "compliance.shyvr.ai/data-classification":
    values: ["public", "internal", "sensitive", "confidential", "restricted"]
  "compliance.shyvr.ai/retention-period":
    values: ["1year", "3years", "7years", "indefinite"]
  "compliance.shyvr.ai/access-level":
    values: ["public", "authenticated", "authorized", "restricted", "system"]
  "security.shyvr.ai/encryption-required":
    values: ["true", "false"]
  "security.shyvr.ai/pci-scope":
    values: ["true", "false"]

# ============================================================================
# TERRAFORM CONFIGURATION REFERENCE
# ============================================================================

terraform_config:
  # Reference terraform configuration for secret management
  secret_manager_setup:
    # Enable Secret Manager API
    apis:
    - "secretmanager.googleapis.com"
    
    # KMS key rings for encryption
    kms_key_rings:
    - name: "shyvr-rlte-production"
      location: "global"
      crypto_keys:
      - name: "secrets-key"
        rotation_period: "2592000s"
      - name: "trading-key"
        rotation_period: "1296000s"
      - name: "api-keys"
        rotation_period: "7776000s"
    
    # Service accounts
    service_accounts:
    - account_id: "shyvr-rlte-production"
      display_name: "RLTE Production Service Account"
      roles:
      - "roles/secretmanager.secretAccessor"
      - "roles/cloudsql.client"
      - "roles/storage.objectAdmin"
    
    # Pub/Sub topics for notifications
    pubsub_topics:
    - name: "secret-rotation-notifications"
      message_retention_duration: "604800s"  # 7 days
# ============================================================================
# Production Environment Variables Template
# Transformer-Enabled RLTE Trading System
# ============================================================================
#
# This template contains all environment variables required for production
# deployment of the transformer-enabled RLTE system with actual implemented
# values and configurations.
#
# Based on actual implementation from:
# - config/config.production.yaml
# - src/ml_analysis/config.py
# - src/deploy/dynamic_resource_allocator.py
# - src/monitoring/transformer_*
#
# CRITICAL: Copy this file to .env.production and fill in actual secrets.
# NEVER commit the actual .env.production file to version control.
#
# Last Updated: 2025-08-06

# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================
ENVIRONMENT=production
VERSION=0.1.0
LOG_LEVEL=INFO
DEBUG=false
HOST=0.0.0.0
PORT=8080

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
# Generate strong random secrets for production
SECRET_KEY=your-super-secret-key-here-min-32-chars-REPLACE-IN-PRODUCTION
JWT_ALGORITHM=HS256
JWT_EXPIRY_HOURS=12
API_KEY_LENGTH=32
RATE_LIMIT_STORAGE=redis

# ============================================================================
# DATABASE CONFIGURATION (Production PostgreSQL)
# ============================================================================
# PostgreSQL Configuration - Production Cloud SQL
POSTGRES_DB=shyvr_rlte_prod
POSTGRES_USER=rlte_production_user
POSTGRES_PASSWORD=REPLACE-WITH-STRONG-PASSWORD-IN-PRODUCTION
POSTGRES_HOST=your-cloud-sql-connection-name
POSTGRES_PORT=5432

# Full database URL for application
DATABASE_URL=postgresql://rlte_production_user:REPLACE-PASSWORD@your-cloud-sql-connection-name:5432/shyvr_rlte_prod

# Connection pooling - production optimized
DB_POOL_SIZE=20
DB_MAX_OVERFLOW=30
DATABASE_POOL_TIMEOUT=30
DATABASE_ECHO=false

# ============================================================================
# GOOGLE CLOUD PLATFORM CONFIGURATION
# ============================================================================
GCP_PROJECT_ID=your-gcp-project-id
GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-service-account.json
GCS_BUCKET=shyvr-models-prod
CLOUD_SQL_CONNECTION_NAME=your-project:region:instance

# ============================================================================
# TRANSFORMER MODEL CONFIGURATION
# ============================================================================
# Model enablement
TRANSFORMER_MODELS_ENABLED=true
MODEL_PRESERVATION_ENABLED=true
MODEL_QUANTIZATION_ENABLED=true
MODEL_COMPRESSION_ENABLED=true
MODE_ISOLATION=true

# Model caching and storage
TRANSFORMERS_CACHE=/app/models/cache/transformers
MODEL_CACHE_SIZE=2048
MODEL_BACKUP_INTERVAL=4
MODEL_MAX_VERSIONS=20

# PyTorch optimization for production
TORCH_COMPILE_MODE=reduce-overhead
TORCH_COMPILE_BACKEND=aot_eager
PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512,garbage_collection_threshold:0.8
PYTORCH_ENABLE_MPS_FALLBACK=1
PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.8

# Threading configuration
OMP_NUM_THREADS=6
MKL_NUM_THREADS=6
OPENBLAS_NUM_THREADS=6
TORCH_NUM_THREADS=6
TOKENIZERS_PARALLELISM=false

# ============================================================================
# TRANSFORMER MODEL ARCHITECTURE SETTINGS
# ============================================================================
# Based on src/ml_analysis/config.py TransformerModelConfig

# Base Transformer Model
TRANSFORMER_D_MODEL=128
TRANSFORMER_NHEAD=8
TRANSFORMER_NUM_LAYERS=4
TRANSFORMER_DROPOUT=0.1
TRANSFORMER_DIM_FEEDFORWARD=512
TRANSFORMER_ACTIVATION=relu
TRANSFORMER_MAX_SEQ_LENGTH=100
TRANSFORMER_INPUT_DIM=20
TRANSFORMER_LEARNING_RATE=0.001
TRANSFORMER_WEIGHT_DECAY=0.01
TRANSFORMER_EPOCHS=50
TRANSFORMER_BATCH_SIZE=32

# iTransformer Configuration
ITRANSFORMER_D_MODEL=128
ITRANSFORMER_NHEAD=8
ITRANSFORMER_NUM_LAYERS=4
ITRANSFORMER_INVERT_TIME_ATTENTION=true
ITRANSFORMER_MULTIVARIATE_PROJECTION=true

# PatchTST Configuration  
PATCHTST_D_MODEL=128
PATCHTST_NHEAD=8
PATCHTST_NUM_LAYERS=4
PATCHTST_PATCH_LEN=16
PATCHTST_STRIDE=8
PATCHTST_CHANNEL_INDEPENDENCE=true

# TimesMixer Configuration
TIMESMIXER_D_MODEL=128
TIMESMIXER_SEQ_LEN=96
TIMESMIXER_PRED_LEN=96
TIMESMIXER_DOWN_SAMPLING_LAYERS=3
TIMESMIXER_DOWN_SAMPLING_WINDOW=2

# Ensemble Configuration
ENSEMBLE_WEIGHTS_LSTM=0.3
ENSEMBLE_WEIGHTS_TRANSFORMER=0.4
ENSEMBLE_WEIGHTS_ITRANSFORMER=0.2
ENSEMBLE_WEIGHTS_PATCHTST=0.1

# ============================================================================
# DYNAMIC RESOURCE ALLOCATION CONFIGURATION
# ============================================================================
# Based on src/deploy/dynamic_resource_allocator.py

DYNAMIC_RESOURCE_ALLOCATION_ENABLED=true
AUTO_SCALING_ENABLED=true
RESOURCE_MONITORING_ENABLED=true

# Model resource profiles
ITRANSFORMER_MEMORY_BASE=4Gi
ITRANSFORMER_MEMORY_MAX=12Gi
ITRANSFORMER_CPU_BASE=2
ITRANSFORMER_CPU_MAX=8
ITRANSFORMER_ATTENTION_COMPLEXITY=1.2

PATCHTST_MEMORY_BASE=3Gi
PATCHTST_MEMORY_MAX=10Gi
PATCHTST_CPU_BASE=2
PATCHTST_CPU_MAX=6
PATCHTST_COMPLEXITY_FACTOR=0.8

TIMESMIXER_MEMORY_BASE=5Gi
TIMESMIXER_MEMORY_MAX=15Gi
TIMESMIXER_CPU_BASE=3
TIMESMIXER_CPU_MAX=10
TIMESMIXER_COMPLEXITY_FACTOR=1.5

TIMESFM_MEMORY_BASE=6Gi
TIMESFM_MEMORY_MAX=20Gi
TIMESFM_CPU_BASE=4
TIMESFM_CPU_MAX=12
TIMESFM_COMPLEXITY_FACTOR=2.0

# Auto-scaling policies
CPU_THRESHOLD_SCALE_UP=80
CPU_THRESHOLD_SCALE_DOWN=30
MEMORY_THRESHOLD_SCALE_UP=85
MEMORY_THRESHOLD_SCALE_DOWN=40
LATENCY_THRESHOLD_SCALE_UP=100
COOLDOWN_SCALE_UP=180
COOLDOWN_SCALE_DOWN=300

# ============================================================================
# REINFORCEMENT LEARNING CONFIGURATION
# ============================================================================
# RL Agent Configuration - production optimized
RL_ALGORITHM=DQN
RL_TRAINING_EPISODES=20000
RL_EPSILON_START=0.5
RL_EPSILON_END=0.01
RL_EPSILON_DECAY=0.9995
RL_LEARNING_RATE=0.00005
RL_GAMMA=0.99
RL_BATCH_SIZE=128
RL_MEMORY_SIZE=100000
RL_TARGET_UPDATE=2000

# Experience Storage Configuration
RL_EXPERIENCE_STORAGE_ENABLED=true
RL_EXPERIENCE_STORAGE_BACKEND=database
RL_EXPERIENCE_MAX_EXPERIENCES=100000
RL_EXPERIENCE_BATCH_SIZE=128
RL_EXPERIENCE_PRIORITIZED_REPLAY=true

# Experience Storage Performance
RL_EXPERIENCE_CACHE_SIZE=2000
RL_EXPERIENCE_ASYNC_OPS=true
RL_EXPERIENCE_COMPRESSION=true
RL_EXPERIENCE_QUERY_TIMEOUT=45
RL_EXPERIENCE_BATCH_COMMIT_SIZE=200

# Experience Database Settings
RL_EXPERIENCE_DB_POOL_SIZE=10
RL_EXPERIENCE_DB_MAX_OVERFLOW=15
RL_EXPERIENCE_DB_TIMEOUT=45
RL_EXPERIENCE_DB_QUERY_LOGGING=false
RL_EXPERIENCE_DB_RETRY_ATTEMPTS=5

# Experience Lifecycle Management
RL_EXPERIENCE_CLEANUP_ENABLED=true
RL_EXPERIENCE_MAX_AGE_DAYS=60
RL_EXPERIENCE_CLEANUP_INTERVAL=12
RL_EXPERIENCE_ARCHIVE_OLD=true
RL_EXPERIENCE_MIN_TO_KEEP=5000

# ============================================================================
# TRADING CONFIGURATION  
# ============================================================================
# Trading modes
LIVE_TRADING_ENABLED=false
PAPER_TRADING_ENABLED=true
ML_PREDICTIONS_ENABLED=true
RL_DECISIONS_ENABLED=true

# Risk Management - production conservative
RISK_MANAGEMENT_ENABLED=true
MAX_POSITION_SIZE_PCT=2.0
MAX_DAILY_LOSS_PCT=3.0
MAX_DRAWDOWN_PCT=10.0
STOP_LOSS_PCT=5.0
TAKE_PROFIT_PCT=15.0
MAX_POSITIONS=3
MIN_TRADE_AMOUNT=50.0

# Position monitoring
POSITION_MONITORING_ENABLED=true
AUTOMATED_STOPS_ENABLED=true
EMERGENCY_SHUTDOWN_ENABLED=true

# ============================================================================
# EXTERNAL API KEYS & SERVICES
# ============================================================================
# OpenAI API
OPENAI_API_KEY=REPLACE-WITH-ACTUAL-OPENAI-API-KEY
AGENT_MODEL_TYPE=openai
AGENT_MODEL_NAME=gpt-4o-mini
AGENT_MAX_TOKENS=1000
AGENT_TEMPERATURE=0.1

# Blockchain APIs
HELIUS_API_KEY=REPLACE-WITH-ACTUAL-HELIUS-API-KEY
ETHERSCAN_API_KEY=REPLACE-WITH-ACTUAL-ETHERSCAN-API-KEY
BIRDEYE_API_KEY=REPLACE-WITH-ACTUAL-BIRDEYE-API-KEY

# API Rate Limits
HELIUS_RATE_LIMIT=100
ETHERSCAN_RATE_LIMIT=5
BIRDEYE_RATE_LIMIT=60
HELIUS_TIMEOUT=30
ETHERSCAN_TIMEOUT=30
BIRDEYE_TIMEOUT=30

# DEX Configuration
JUPITER_API_URL=https://quote-api.jup.ag/v6
HYPERLIQUID_API_URL=https://api.hyperliquid.xyz
UNISWAP_V3_FACTORY=0x1F98431c8aD98523631AE4a59f267346ea31F984

# ============================================================================
# MONITORING & OBSERVABILITY CONFIGURATION
# ============================================================================
# Based on src/monitoring/transformer_* implementations

# General monitoring
MONITORING_ENABLED=true
METRICS_PORT=9090
HEALTH_CHECK_PORT=8081
MONITORING_LOG_LEVEL=INFO

# Prometheus
PROMETHEUS_ENABLED=true
PROMETHEUS_PORT=9090
PROMETHEUS_RETENTION_DAYS=30

# Grafana
GRAFANA_ENABLED=true
GRAFANA_PORT=3000
GRAFANA_ADMIN_PASSWORD=REPLACE-WITH-STRONG-PASSWORD

# Alert configuration
ALERT_WEBHOOK_URL=REPLACE-WITH-WEBHOOK-URL
CRITICAL_THRESHOLD=0.95
WARNING_THRESHOLD=0.8

# Transformer-specific monitoring thresholds
TRANSFORMER_MEMORY_ALERT_THRESHOLD=90
TRANSFORMER_LATENCY_ALERT_THRESHOLD=1000
TRANSFORMER_CACHE_HIT_RATE_THRESHOLD=50
TRANSFORMER_HEALTH_CHECK_INTERVAL=30

# ============================================================================
# TELEGRAM BOT CONFIGURATION (Optional)
# ============================================================================
TELEGRAM_TOKEN=REPLACE-WITH-BOT-TOKEN
TELEGRAM_WEBHOOK_SECRET=REPLACE-WITH-WEBHOOK-SECRET
TELEGRAM_RATE_LIMIT=10

# Monitoring bot (for alerts)
TELEGRAM_MONITORING_BOT_TOKEN=REPLACE-WITH-MONITORING-BOT-TOKEN
TELEGRAM_MONITORING_CHAT_ID=REPLACE-WITH-CHAT-ID

# ============================================================================
# REDIS CONFIGURATION
# ============================================================================
REDIS_URL=redis://redis:6379/0
REDIS_PASSWORD=REPLACE-WITH-REDIS-PASSWORD

# ============================================================================
# EMAIL ALERTING (Optional)
# ============================================================================
ALERT_EMAIL_CRITICAL=alerts-critical@your-domain.com
ALERT_EMAIL_WARNING=alerts-warning@your-domain.com
SMTP_HOST=smtp.your-domain.com
SMTP_PORT=587
SMTP_USER=noreply@your-domain.com
SMTP_PASSWORD=REPLACE-WITH-SMTP-PASSWORD

# ============================================================================
# NETWORK & PERFORMANCE CONFIGURATION
# ============================================================================
# FastAPI/Uvicorn
WORKERS=1
MAX_REQUESTS=1000
MAX_REQUESTS_JITTER=50
TIMEOUT_KEEP_ALIVE=5

# CORS (adjust for your frontend domain)
ALLOWED_ORIGINS=https://your-production-domain.com,https://api.your-production-domain.com
ALLOWED_HOSTS=your-production-domain.com,api.your-production-domain.com

# ============================================================================
# BACKUP CONFIGURATION
# ============================================================================
BACKUP_ENABLED=true
BACKUP_SCHEDULE="0 2 * * *"  # Daily at 2 AM
BACKUP_RETENTION_DAYS=30
BACKUP_STORAGE_PATH=/app/backups

# ============================================================================
# SSL/TLS CONFIGURATION
# ============================================================================
SSL_CERT_PATH=/app/certs/cert.pem
SSL_KEY_PATH=/app/certs/key.pem

# ============================================================================
# FEATURE FLAGS
# ============================================================================
# Production feature flags
LIVE_TRADING_ENABLED=false  # Explicitly disabled by default
PAPER_TRADING_ENABLED=true
ML_PREDICTIONS_ENABLED=true
RL_DECISIONS_ENABLED=true
RISK_MANAGEMENT_ENABLED=true
POSITION_MONITORING_ENABLED=true
AUTOMATED_STOPS_ENABLED=true
EMERGENCY_SHUTDOWN_ENABLED=true

# Transformer features
TRANSFORMER_DRIFT_DETECTION_ENABLED=true
TRANSFORMER_ATTENTION_MONITORING_ENABLED=true
TRANSFORMER_PERFORMANCE_OPTIMIZATION_ENABLED=true
TRANSFORMER_AB_TESTING_ENABLED=true
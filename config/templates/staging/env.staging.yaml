# ============================================================================
# Staging Environment Variables Template  
# Transformer-Enabled RLTE Trading System
# ============================================================================
#
# This template contains environment variables for staging deployment with
# reduced resource requirements and test-safe configurations.
#
# Based on production template with staging-specific adjustments.
#
# Last Updated: 2025-08-06

# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================
ENVIRONMENT=staging
VERSION=0.1.0-staging
LOG_LEVEL=DEBUG
DEBUG=true
HOST=0.0.0.0
PORT=8080

# ============================================================================
# SECURITY CONFIGURATION - STAGING
# ============================================================================
SECRET_KEY=staging-secret-key-not-for-production-use
JWT_ALGORITHM=HS256
JWT_EXPIRY_HOURS=24
API_KEY_LENGTH=32
RATE_LIMIT_STORAGE=memory

# ============================================================================
# DATABASE CONFIGURATION (Staging PostgreSQL)
# ============================================================================
POSTGRES_DB=shyvr_rlte_staging
POSTGRES_USER=rlte_staging_user
POSTGRES_PASSWORD=staging-password-replace-for-security
POSTGRES_HOST=staging-cloud-sql-connection
POSTGRES_PORT=5432

DATABASE_URL=postgresql://rlte_staging_user:staging-password@staging-cloud-sql-connection:5432/shyvr_rlte_staging

# Connection pooling - staging optimized
DB_POOL_SIZE=10
DB_MAX_OVERFLOW=15
DATABASE_POOL_TIMEOUT=30
DATABASE_ECHO=false

# ============================================================================
# GOOGLE CLOUD PLATFORM CONFIGURATION - STAGING
# ============================================================================
GCP_PROJECT_ID=your-gcp-project-staging
GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-service-account.json
GCS_BUCKET=shyvr-models-staging
CLOUD_SQL_CONNECTION_NAME=your-project:region:staging-instance

# ============================================================================
# TRANSFORMER MODEL CONFIGURATION - STAGING
# ============================================================================
TRANSFORMER_MODELS_ENABLED=true
MODEL_PRESERVATION_ENABLED=true
MODEL_QUANTIZATION_ENABLED=false  # Disabled for faster staging cycles
MODEL_COMPRESSION_ENABLED=false
MODE_ISOLATION=true

# Model caching - reduced for staging
TRANSFORMERS_CACHE=/app/models/cache/transformers
MODEL_CACHE_SIZE=1024
MODEL_BACKUP_INTERVAL=6
MODEL_MAX_VERSIONS=10

# PyTorch optimization - staging (less aggressive)
TORCH_COMPILE_MODE=default
PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256,garbage_collection_threshold:0.6

# Threading configuration - staging
OMP_NUM_THREADS=4
MKL_NUM_THREADS=4
OPENBLAS_NUM_THREADS=4
TORCH_NUM_THREADS=4
TOKENIZERS_PARALLELISM=false

# ============================================================================
# TRANSFORMER MODEL ARCHITECTURE SETTINGS - STAGING
# ============================================================================
# Reduced complexity for staging

# Base Transformer Model
TRANSFORMER_D_MODEL=64
TRANSFORMER_NHEAD=4
TRANSFORMER_NUM_LAYERS=2
TRANSFORMER_DROPOUT=0.1
TRANSFORMER_DIM_FEEDFORWARD=256
TRANSFORMER_MAX_SEQ_LENGTH=50
TRANSFORMER_BATCH_SIZE=16

# iTransformer Configuration - staging
ITRANSFORMER_D_MODEL=64
ITRANSFORMER_NHEAD=4
ITRANSFORMER_NUM_LAYERS=2

# PatchTST Configuration - staging
PATCHTST_D_MODEL=64
PATCHTST_NHEAD=4
PATCHTST_NUM_LAYERS=2
PATCHTST_PATCH_LEN=8
PATCHTST_STRIDE=4

# ============================================================================
# DYNAMIC RESOURCE ALLOCATION - STAGING
# ============================================================================
DYNAMIC_RESOURCE_ALLOCATION_ENABLED=true
AUTO_SCALING_ENABLED=true
RESOURCE_MONITORING_ENABLED=true

# Staging resource profiles (reduced)
ITRANSFORMER_MEMORY_BASE=2Gi
ITRANSFORMER_MEMORY_MAX=6Gi
ITRANSFORMER_CPU_BASE=1
ITRANSFORMER_CPU_MAX=4

PATCHTST_MEMORY_BASE=1.5Gi
PATCHTST_MEMORY_MAX=4Gi
PATCHTST_CPU_BASE=1
PATCHTST_CPU_MAX=3

TIMESMIXER_MEMORY_BASE=2.5Gi
TIMESMIXER_MEMORY_MAX=8Gi
TIMESMIXER_CPU_BASE=2
TIMESMIXER_CPU_MAX=6

TIMESFM_MEMORY_BASE=3Gi
TIMESFM_MEMORY_MAX=10Gi
TIMESFM_CPU_BASE=2
TIMESFM_CPU_MAX=8

# ============================================================================
# REINFORCEMENT LEARNING CONFIGURATION - STAGING
# ============================================================================
# Reduced training for faster staging cycles
RL_ALGORITHM=DQN
RL_TRAINING_EPISODES=5000
RL_BATCH_SIZE=64
RL_MEMORY_SIZE=50000

# Experience Storage - staging
RL_EXPERIENCE_MAX_EXPERIENCES=50000
RL_EXPERIENCE_CACHE_SIZE=1000
RL_EXPERIENCE_MAX_AGE_DAYS=30
RL_EXPERIENCE_MIN_TO_KEEP=1000

# ============================================================================
# TRADING CONFIGURATION - STAGING SAFE
# ============================================================================
LIVE_TRADING_ENABLED=false
PAPER_TRADING_ENABLED=true
ML_PREDICTIONS_ENABLED=true
RL_DECISIONS_ENABLED=true

# Conservative risk for staging
RISK_MANAGEMENT_ENABLED=true
MAX_POSITION_SIZE_PCT=1.0
MAX_DAILY_LOSS_PCT=2.0
MAX_DRAWDOWN_PCT=5.0
STOP_LOSS_PCT=3.0
MAX_POSITIONS=2
MIN_TRADE_AMOUNT=25.0

# ============================================================================
# EXTERNAL API KEYS - STAGING/TEST KEYS
# ============================================================================
OPENAI_API_KEY=staging-openai-key-replace
HELIUS_API_KEY=staging-helius-key-replace
ETHERSCAN_API_KEY=staging-etherscan-key-replace
BIRDEYE_API_KEY=staging-birdeye-key-replace

# Reduced rate limits for staging
HELIUS_RATE_LIMIT=50
ETHERSCAN_RATE_LIMIT=3
BIRDEYE_RATE_LIMIT=30

# ============================================================================
# MONITORING & OBSERVABILITY - STAGING
# ============================================================================
MONITORING_ENABLED=true
PROMETHEUS_ENABLED=true
GRAFANA_ENABLED=false  # Disabled for staging simplicity

# Relaxed thresholds for staging
TRANSFORMER_MEMORY_ALERT_THRESHOLD=80
TRANSFORMER_LATENCY_ALERT_THRESHOLD=2000
TRANSFORMER_CACHE_HIT_RATE_THRESHOLD=30

# ============================================================================
# TELEGRAM CONFIGURATION - STAGING
# ============================================================================
TELEGRAM_TOKEN=staging-bot-token-replace
TELEGRAM_RATE_LIMIT=20

# ============================================================================
# REDIS CONFIGURATION - STAGING
# ============================================================================
REDIS_URL=redis://staging-redis:6379/0
REDIS_PASSWORD=staging-redis-password

# ============================================================================
# NETWORK & PERFORMANCE - STAGING
# ============================================================================
WORKERS=1
MAX_REQUESTS=500
TIMEOUT_KEEP_ALIVE=5

ALLOWED_ORIGINS=https://staging.your-domain.com,http://localhost:3000
ALLOWED_HOSTS=staging.your-domain.com,localhost

# ============================================================================
# FEATURE FLAGS - STAGING
# ============================================================================
LIVE_TRADING_ENABLED=false
PAPER_TRADING_ENABLED=true
TRANSFORMER_DRIFT_DETECTION_ENABLED=true
TRANSFORMER_ATTENTION_MONITORING_ENABLED=true
TRANSFORMER_PERFORMANCE_OPTIMIZATION_ENABLED=false
TRANSFORMER_AB_TESTING_ENABLED=true
# ============================================================================
# GCP Cloud Run Service Configuration Template - Staging Environment  
# Transformer-Enabled RLTE Trading System
# ============================================================================
#
# This template configures Cloud Run service for staging deployment with
# scaled-down resources for testing and validation of transformer models.
#
# Based on actual implementation from:
# - src/deploy/dynamic_resource_allocator.py
# - deploy/deploy-utils.sh (staging configuration)
#
# Last Updated: 2025-08-06

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: shyvr-rlte-staging
  namespace: default
  labels:
    app: shyvr-rlte
    environment: staging
    version: "1.0.0-staging"
    component: trading-system
  annotations:
    run.googleapis.com/cpu-throttling: "false"
    run.googleapis.com/execution-environment: gen2
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: "Staging environment for transformer-enabled RLTE"
    
    # Staging-specific annotations
    monitoring.shyvr.ai/enable-transformer-metrics: "true"
    deployment.shyvr.ai/resource-profile: "transformer-staging"
    scaling.shyvr.ai/model-aware: "true"
    
spec:
  template:
    metadata:
      name: shyvr-rlte-staging-${REVISION_SUFFIX}
      labels:
        app: shyvr-rlte
        environment: staging
        revision: "${REVISION_SUFFIX}"
      annotations:
        # Auto-scaling configuration - staging optimized
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        autoscaling.knative.dev/target: "60"
        autoscaling.knative.dev/targetUtilizationPercentage: "60"
        
        # Resource allocation - staging profile (6Gi/4CPU)
        run.googleapis.com/memory: "6Gi"
        run.googleapis.com/cpu: "4"
        run.googleapis.com/startup-cpu-boost: "true"
        
        # Timeout configuration - staging (45 minutes)
        run.googleapis.com/timeout: "2700s"
        
        # Concurrency control - staging optimized
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        
        # Execution environment
        run.googleapis.com/execution-environment: gen2
        
    spec:
      serviceAccountName: shyvr-rlte-staging-service-account
      containerConcurrency: 20  # Higher concurrency for staging testing
      timeoutSeconds: 2700       # 45 minutes for staging
      
      containers:
      - name: shyvr-rlte-container
        image: "${STAGING_IMAGE_URL}"
        
        ports:
        - name: http1
          containerPort: 8080
          protocol: TCP
        
        # Staging resource allocation
        resources:
          requests:
            memory: "6Gi"
            cpu: "4"
          limits:
            memory: "6Gi"
            cpu: "4"
        
        # Environment variables for staging
        env:
        # Application configuration
        - name: ENVIRONMENT
          value: "staging"
        - name: LOG_LEVEL
          value: "DEBUG"
        - name: DEBUG
          value: "true"
        - name: PORT
          value: "8080"
        - name: HOST
          value: "0.0.0.0"
        
        # Transformer configuration - staging optimized
        - name: TORCH_COMPILE_MODE
          value: "default"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "max_split_size_mb:256,garbage_collection_threshold:0.6"
        - name: TRANSFORMERS_CACHE
          value: "/app/models/cache/transformers"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: OMP_NUM_THREADS
          value: "4"
        - name: MKL_NUM_THREADS
          value: "4"
        - name: TORCH_NUM_THREADS
          value: "4"
        
        # Model configuration
        - name: MODEL_PRESERVATION_ENABLED
          value: "true"
        - name: TRANSFORMER_MODELS_ENABLED
          value: "true"
        - name: MODEL_CACHE_SIZE
          value: "1024"
        - name: MODEL_QUANTIZATION_ENABLED
          value: "false"
        
        # Database configuration - staging database
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: database-credentials-staging
              key: host
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: database-credentials-staging
              key: database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: database-credentials-staging
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials-staging
              key: password
        - name: DB_POOL_SIZE
          value: "10"
        - name: DB_MAX_OVERFLOW
          value: "15"
        
        # GCP Configuration
        - name: GCP_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: gcp-credentials-staging
              key: project_id
        - name: GCS_BUCKET
          valueFrom:
            secretKeyRef:
              name: gcp-credentials-staging
              key: model_bucket
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/app/secrets/gcp-service-account.json"
        
        # API Keys - staging/test keys
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys-staging
              key: openai_key
        - name: HELIUS_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys-staging
              key: helius_key
        
        # Trading configuration - safe for staging
        - name: LIVE_TRADING_ENABLED
          value: "false"
        - name: PAPER_TRADING_ENABLED
          value: "true"
        - name: MAX_POSITION_SIZE_PCT
          value: "1.0"
        - name: MAX_DAILY_LOSS_PCT
          value: "2.0"
        
        # Monitoring - staging configuration
        - name: MONITORING_ENABLED
          value: "true"
        - name: PROMETHEUS_ENABLED
          value: "true"
        - name: GRAFANA_ENABLED
          value: "false"
        
        # Volume mounts
        volumeMounts:
        - name: gcp-service-account
          mountPath: "/app/secrets"
          readOnly: true
        - name: model-cache
          mountPath: "/app/models/cache"
        - name: transformer-cache
          mountPath: "/app/models/cache/transformers"
        
        # Health checks - staging optimized
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 15
          failureThreshold: 10
          successThreshold: 1
        
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
      
      # Volume definitions
      volumes:
      - name: gcp-service-account
        secret:
          secretName: gcp-service-account-staging
          defaultMode: 0400
      - name: model-cache
        emptyDir:
          sizeLimit: "5Gi"
      - name: transformer-cache
        emptyDir:
          sizeLimit: "2Gi"

---

# ============================================================================
# Staging HPA Configuration
# ============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shyvr-rlte-staging-hpa
  namespace: default
  labels:
    app: shyvr-rlte
    environment: staging
spec:
  scaleTargetRef:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: shyvr-rlte-staging
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      selectPolicy: Min
[project]
name = "shyvr-rlte"
version = "0.1.0"
description = "AI-augmented cryptocurrency trading bot with reinforcement learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core ML/AI Framework
    "torch>=2.7.1",
    "stable-baselines3>=2.6.0",
    "pandas>=2.3.1",
    "numpy>=2.3.1",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.0",
    "matplotlib>=3.10.3",
    "gymnasium>=1.1.1",
    "joblib>=1.5.1",
    # LLM/AI Framework
    "langchain>=0.3.26",
    "langchain-core>=0.3.71",
    "langchain-openai>=0.3.28",
    "langchain-text-splitters>=0.3.8",
    "langsmith>=0.4.8",
    "openai>=1.97.1",
    "pydantic>=2.11.7",
    "jinja2>=3.1.6",
    # Blockchain/Crypto APIs
    "solana>=0.36.7",
    "web3>=7.12.1",
    "eth-account>=0.13.7",
    "base58>=2.1.1",
    "hyperliquid>=0.4.66",
    "uniswap-python>=0.3.4",
    # Trading & Market Data
    "backtrader>=1.9.78",
    "ccxt>=4.4.95",
    # Web Framework & Infrastructure
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "aiohttp>=3.10.11",
    "requests>=2.32.4",
    "asyncio-throttle>=1.0.2",
    # Database
    "asyncpg>=0.30.0",
    # Messaging & Communication
    "python-telegram-bot>=22.3",
    # Configuration & Utilities
    "pyyaml>=6.0.2",
    "python-dotenv>=1.1.1",
    "click>=8.2.1",
    "structlog>=25.4.0",
    "orjson>=3.11.0",
    # Security & Cryptography
    "cryptography>=45.0.5",
    "keyring>=25.6.0",
    "pyjwt>=2.10.1",
    "bcrypt>=4.3.0",
    "prometheus-client>=0.22.1",
    "psutil>=7.0.0",
    "plotly>=5.17.0",
    "scikit-image>=0.22.0",
    "lime>=0.2.0.1",
    "google-cloud-secret-manager>=2.24.0",
    # Monitoring and Alerting
    "google-cloud-monitoring>=2.24.0",
    "google-cloud-logging>=3.10.0",
    "httpx>=0.28.1",
    "google-cloud-monitoring-dashboards>=2.18.2",
    "google-cloud-storage>=3.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "brotli>=1.1.0",
    "lz4>=4.4.4",
    "onnx>=1.18.0",
    "transformers>=4.54.1",
    "huggingface-hub>=0.34.3",
]

[project.optional-dependencies]
dev = [
    # Testing Framework
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "pytest-benchmark>=5.1.0",
    "coverage>=7.9.2",
    
    # Code Quality & Linting
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.17.0",
    "ruff>=0.12.4",
    "types-requests>=2.32.4",
    
    # Performance Monitoring
    "psutil>=7.0.0",
    
    # Documentation
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

production = [
    # Production monitoring
    "sentry-sdk>=2.17.0",
    "prometheus-client>=0.21.0",
    
    # Performance
    "uvloop>=0.21.0",  # Faster event loop
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
markers = [
    "performance: marks tests as performance benchmarks",
    "slow: marks tests as slow running",
    "memory: marks tests that monitor memory usage",
    "regression: marks tests for performance regression detection",
    "benchmark: marks tests that use pytest-benchmark",
    "integration: marks integration performance tests",
    "unit: marks unit performance tests",
    "network: marks tests that require network access"
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP"]
ignore = ["E501"]  # Line too long (handled by black)


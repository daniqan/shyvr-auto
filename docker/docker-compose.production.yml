# =============================================================================
# Docker Compose - Production Configuration for Shyvr RLTE
# =============================================================================
version: '3.8'

services:
  # Main application service
  shyvr-rlte:
    build:
      context: .
      dockerfile: Dockerfile.optimized
      args:
        - BUILDKIT_INLINE_CACHE=1
      cache_from:
        - shyvr-rlte:latest
    image: shyvr-rlte:${VERSION:-latest}
    container_name: shyvr-rlte-app
    restart: unless-stopped
    
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    
    # Security context
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Network configuration
    ports:
      - "8080:8080"
    
    # Environment variables
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MALLOC_ARENA_MAX=2
      # Database configuration
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=10
      # Security
      - SECRET_KEY=${SECRET_KEY}
      # Monitoring
      - ENABLE_METRICS=true
      - METRICS_PORT=8080
      # Logging
      - LOG_LEVEL=INFO
      - STRUCTURED_LOGGING=true
    
    # Volume mounts (read-only where possible)
    volumes:
      # Writable volumes for application data
      - app-data:/app/data
      - app-logs:/app/logs
      - app-cache:/app/cache
      - app-models:/app/models
      # Temporary directory
      - type: tmpfs
        target: /app/tmp
        tmpfs:
          size: 100M
          mode: 0755
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=shyvr-rlte"
    
    # Dependencies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # Networks
    networks:
      - app-network
      - db-network

  # PostgreSQL database for RL experience storage
  postgres:
    image: postgres:16-alpine
    container_name: shyvr-rlte-postgres
    restart: unless-stopped
    
    # Security
    user: postgres
    
    # Environment
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-shyvr_rlte}
      - POSTGRES_USER=${POSTGRES_USER:-rlte_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    
    # Volumes
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init_database.py:/docker-entrypoint-initdb.d/01-init.py:ro
      - ./database/migrations:/opt/migrations:ro
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rlte_user} -d ${POSTGRES_DB:-shyvr_rlte}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Networks
    networks:
      - db-network
    
    # PostgreSQL configuration
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.7
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_statement=error
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: shyvr-rlte-redis
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    # Configuration
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    
    # Volumes
    volumes:
      - redis-data:/data
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    # Networks
    networks:
      - app-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: shyvr-rlte-prometheus
    restart: unless-stopped
    
    # Configuration
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    
    # Volumes
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    # Ports
    ports:
      - "9090:9090"
    
    # Networks
    networks:
      - monitoring-network
      - app-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M

  # Grafana for monitoring dashboards
  grafana:
    image: grafana/grafana:10.0.0
    container_name: shyvr-rlte-grafana
    restart: unless-stopped
    
    # Environment
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    
    # Volumes
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    # Ports
    ports:
      - "3000:3000"
    
    # Networks
    networks:
      - monitoring-network
    
    # Dependencies
    depends_on:
      - prometheus

# =============================================================================
# Network Configuration
# =============================================================================
networks:
  # Application network for app-to-cache communication
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  
  # Database network for app-to-db communication
  db-network:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.21.0.0/16
  
  # Monitoring network
  monitoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

# =============================================================================
# Volume Configuration
# =============================================================================
volumes:
  # Application data
  app-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}
  
  app-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_DIR:-./logs}
  
  app-cache:
    driver: local
  
  app-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODELS_DIR:-./models}
  
  # Database data
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_DIR:-./postgres-data}
  
  # Cache data
  redis-data:
    driver: local
  
  # Monitoring data
  prometheus-data:
    driver: local
  
  grafana-data:
    driver: local
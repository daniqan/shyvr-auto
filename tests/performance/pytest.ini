[tool:pytest]
# Performance test configuration for ML-RL benchmarking

# Test selection
testpaths = tests/performance
python_files = test_*_performance.py
python_classes = Test*Performance Test*Regression TestResource*
python_functions = test_*

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Performance-specific markers
markers =
    performance: marks tests as performance benchmarks
    slow: marks tests as slow running (deselect with '-m "not slow"')
    memory: marks tests that monitor memory usage
    regression: marks tests for performance regression detection
    benchmark: marks tests that use pytest-benchmark
    integration: marks integration performance tests
    unit: marks unit performance tests

# Benchmark configuration
addopts = 
    --benchmark-only
    --benchmark-sort=mean
    --benchmark-columns=min,max,mean,stddev,rounds,iterations
    --benchmark-warmup=on
    --benchmark-warmup-iterations=3
    --benchmark-timer=time.perf_counter
    --benchmark-disable-gc
    --benchmark-json=performance_results.json
    --benchmark-save=baseline
    --benchmark-compare-fail=min:5%
    --benchmark-compare-fail=max:10%
    --strict-markers
    -v

# Timeout for performance tests (30 seconds max per test)
timeout = 30

# Disable warnings for cleaner output during benchmarking
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:torch.*
    ignore::FutureWarning:torch.*

# Minimum Python version
minversion = 3.12

# Test discovery patterns
norecursedirs = .git .tox dist build *.egg htmlcov
name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: 'false'
        type: boolean
      test_level:
        description: 'Test execution level'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - unit-only
          - integration-only

env:
  PYTHON_VERSION: '3.12'
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: shvyr-ai-bots
  REPOSITORY: shyvr-ai-prod
  IMAGE_NAME: shyvr-rlte
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # PREPARATION AND SETUP
  # =============================================================================
  setup:
    name: Setup and Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.test-matrix.outputs.matrix }}
      should-deploy: ${{ steps.deploy-check.outputs.should-deploy }}
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Generate cache keys
        id: cache-key
        run: |
          echo "key=python-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}" >> $GITHUB_OUTPUT
          
      - name: Setup test matrix
        id: test-matrix
        run: |
          if [[ "${{ github.event.inputs.test_level }}" == "unit-only" ]]; then
            echo 'matrix={"test-type": ["unit"]}' >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.test_level }}" == "integration-only" ]]; then
            echo 'matrix={"test-type": ["integration"]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"test-type": ["unit", "integration", "performance"]}' >> $GITHUB_OUTPUT
          fi
          
      - name: Check deployment conditions
        id: deploy-check
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  # =============================================================================
  # CODE QUALITY AND SECURITY CHECKS
  # =============================================================================
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
        
      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras
          
      - name: Cache analysis results
        uses: actions/cache@v4
        with:
          path: |
            .mypy_cache
            .ruff_cache
          key: analysis-${{ runner.os }}-${{ needs.setup.outputs.cache-key }}
          
      - name: Run Black formatting check
        run: |
          echo "::group::Black Formatting"
          uv run black --check --diff src/ tests/
          echo "::endgroup::"
          
      - name: Run isort import sorting check
        run: |
          echo "::group::Import Sorting"
          uv run isort --check-only --diff src/ tests/
          echo "::endgroup::"
          
      - name: Run Ruff linting
        run: |
          echo "::group::Ruff Linting"
          uv run ruff check src/ tests/ --output-format=github
          echo "::endgroup::"
          
      - name: Run MyPy type checking
        run: |
          echo "::group::Type Checking"
          uv run mypy src/ --show-error-codes --pretty
          echo "::endgroup::"
          
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =============================================================================
  # TESTING MATRIX
  # =============================================================================
  test:
    name: Tests (${{ matrix.test-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [setup, code-quality]
    if: ${{ !inputs.skip_tests }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libpq-dev \
            libssl-dev \
            libta-lib-dev \
            postgresql-client
            
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
        
      - name: Install dependencies
        run: uv sync --frozen --all-extras
        
      - name: Setup test environment
        run: |
          echo "PYTHONPATH=${{ github.workspace }}/src" >> $GITHUB_ENV
          echo "ENVIRONMENT=test" >> $GITHUB_ENV
          echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb" >> $GITHUB_ENV
          
      - name: Initialize test database
        run: |
          export PGPASSWORD=testpass
          psql -h localhost -U testuser -d testdb -f database/migrations/001_create_initial_schema.sql
          psql -h localhost -U testuser -d testdb -f database/migrations/002_create_indexes_and_functions.sql
          psql -h localhost -U testuser -d testdb -f database/migrations/003_create_views_and_permissions.sql
          psql -h localhost -U testuser -d testdb -f database/migrations/004_create_rl_experience_schema.sql
          
      - name: Run unit tests
        if: matrix.test-type == 'unit'
        run: |
          uv run pytest tests/unit/ \
            --cov=src \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=html:htmlcov-unit \
            --cov-report=term-missing \
            --junit-xml=pytest-unit-results.xml \
            --tb=short \
            -v \
            --maxfail=10
            
      - name: Run integration tests
        if: matrix.test-type == 'integration'
        run: |
          timeout 600 uv run pytest tests/integration/ \
            --junit-xml=pytest-integration-results.xml \
            --tb=short \
            -v \
            -x \
            --maxfail=5 || {
              echo "::warning::Some integration tests failed - this may be expected for external dependencies"
              exit 0
            }
            
      - name: Run performance tests
        if: matrix.test-type == 'performance'
        run: |
          timeout 300 uv run pytest tests/performance/ \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --junit-xml=pytest-performance-results.xml \
            -v \
            --maxfail=3 || {
              echo "::warning::Performance tests completed with warnings"
              exit 0
            }
            
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-type }}
          path: |
            pytest-*-results.xml
            coverage-*.xml
            htmlcov-*
            benchmark-results.json
          retention-days: 30
          
      - name: Upload coverage to Codecov
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v4
        with:
          file: coverage-unit.xml
          flags: unittests
          name: codecov-unit
          fail_ci_if_error: false

  # =============================================================================
  # ML/RL SPECIFIC VALIDATION
  # =============================================================================
  ml-rl-validation:
    name: ML/RL Model Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
        
      - name: Install dependencies
        run: uv sync --frozen --all-extras
        
      - name: Validate ML models
        run: |
          echo "::group::ML Model Validation"
          uv run python scripts/validate_ml_rl_models.py --mode=ci
          echo "::endgroup::"
          
      - name: Run model performance benchmarks
        run: |
          echo "::group::Model Performance Benchmarks"
          uv run pytest tests/performance/test_ml_rl_performance.py \
            --benchmark-only \
            --benchmark-json=ml-benchmark-results.json \
            -v
          echo "::endgroup::"
          
      - name: Upload ML validation results
        uses: actions/upload-artifact@v4
        with:
          name: ml-validation-results
          path: |
            ml-benchmark-results.json
            reports/ml-validation-*.json
          retention-days: 15

  # =============================================================================
  # DOCKER BUILD AND SECURITY SCAN
  # =============================================================================
  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, code-quality]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar
          
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image.tar
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'HIGH,CRITICAL'
          
      - name: Upload Trivy image results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'docker-image'
          
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        if: needs.setup.outputs.should-deploy == 'true'
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # =============================================================================
  # DEPLOYMENT READINESS VALIDATION
  # =============================================================================
  deployment-validation:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, test, ml-rl-validation, docker-build]
    if: needs.setup.outputs.should-deploy == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
        
      - name: Install dependencies
        run: uv sync --frozen --all-extras
        
      - name: Run deployment validation scripts
        run: |
          echo "::group::Pre-deployment Validation"
          bash scripts/run_all_validations.sh ${{ env.PROJECT_ID }} "http://localhost:8080" true
          echo "::endgroup::"
          
      - name: Validate API endpoints
        run: |
          echo "::group::API Endpoint Validation"
          uv run python scripts/validate_api_endpoints.py --mode=validation
          echo "::endgroup::"
          
      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        with:
          name: deployment-validation-reports
          path: reports/
          retention-days: 30

  # =============================================================================
  # NOTIFICATION AND REPORTING
  # =============================================================================
  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [setup, code-quality, test, ml-rl-validation, docker-build, deployment-validation]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## 🚀 Shyvr RLTE CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && '✅' || needs.test.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ML/RL Validation | ${{ needs.ml-rl-validation.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Validation | ${{ needs.deployment-validation.result == 'success' && '✅' || needs.deployment-validation.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'code-quality': '${{ needs.code-quality.result }}',
              'test': '${{ needs.test.result }}',
              'ml-rl-validation': '${{ needs.ml-rl-validation.result }}',
              'docker-build': '${{ needs.docker-build.result }}'
            };
            
            const getEmoji = (result) => {
              switch(result) {
                case 'success': return '✅';
                case 'skipped': return '⏭️';
                case 'failure': return '❌';
                case 'cancelled': return '🚫';
                default: return '⚪';
              }
            };
            
            let body = `## 🤖 CI Pipeline Results\n\n`;
            body += `| Check | Status |\n|-------|--------|\n`;
            
            for (const [job, result] of Object.entries(results)) {
              body += `| ${job.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase())} | ${getEmoji(result)} ${result} |\n`;
            }
            
            body += `\n**Commit:** ${context.sha.substring(0, 8)}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });